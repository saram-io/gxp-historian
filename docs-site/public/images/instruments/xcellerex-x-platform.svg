<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1120" height="560" rx="14" fill="url(#bg2)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">Cytiva Xcellerex™ XDR Bioreactor &amp; XDUO Mixer — Physical &amp; Software Connection Guide</text>
  <text x="32" y="60" fill="#94a3b8" font-size="13">Locating the RJ45 Ethernet ports on the Figurate™ Automation Cabinet (Emerson DeltaV™ / Rockwell PlantPAx®) &amp; enabling OPC UA</text>
  <line x1="32" y1="74" x2="1088" y2="74" stroke="#334155" stroke-width="1"/>

  <!-- PANEL 1: Xcellerex Bioreactor + Figurate Tower -->
  <rect x="28" y="90" width="350" height="444" rx="10" fill="#162032" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="52" cy="116" r="13" fill="#0284c7"/>
  <text x="52" y="121" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
  <text x="74" y="116" fill="#f8fafc" font-size="14" font-weight="700">Physical Equipment on Cleanroom Floor</text>
  <text x="74" y="133" fill="#38bdf8" font-size="11">XDR 50L–2000L Vessel Frame + Figurate™ I/O Tower</text>

  <!-- Stainless Bioreactor Vessel Drawing -->
  <rect x="52" y="156" width="136" height="220" rx="18" fill="url(#vessel)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Sight Glass Window showing Single-Use Bag & Media -->
  <rect x="78" y="182" width="84" height="145" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <path d="M78 235 Q100 229 120 235 T162 235 L162 327 L78 327 Z" fill="#0284c7" fill-opacity="0.45"/>
  <!-- Bottom Magnetic Impeller -->
  <line x1="120" y1="295" x2="120" y2="326" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="120" cy="300" rx="26" ry="7" fill="#38bdf8"/>
  <!-- Sensor Probes sticking into bag -->
  <line x1="62" y1="270" x2="96" y2="270" stroke="#34d399" stroke-width="3"/>
  <circle cx="58" cy="270" r="5" fill="#34d399"/>
  <text x="120" y="205" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">XDR-2000 Bag</text>
  <text x="120" y="258" text-anchor="middle" fill="#bae6fd" font-size="9.5">Temp: 37.0°C</text>
  <text x="120" y="273" text-anchor="middle" fill="#bae6fd" font-size="9.5">pH: 7.05 • DO: 42%</text>
  <!-- Load cell legs -->
  <rect x="64" y="376" width="16" height="32" fill="#64748b"/>
  <rect x="160" y="376" width="16" height="32" fill="#64748b"/>
  <rect x="54" y="406" width="36" height="8" rx="2" fill="#facc15"/>
  <rect x="150" y="406" width="36" height="8" rx="2" fill="#facc15"/>
  <text x="120" y="428" text-anchor="middle" fill="#facc15" font-size="10">Load Cells (WI_01.PV)</text>

  <!-- Figurate Control Tower -->
  <rect x="210" y="156" width="146" height="258" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <!-- HMI Touchscreen -->
  <rect x="224" y="172" width="118" height="74" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="283" y="191" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">Figurate™ HMI</text>
  <polyline points="232,228 250,225 268,210 286,216 305,204 332,208" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="283" y="240" text-anchor="middle" fill="#94a3b8" font-size="8.5">Phase: FED_BATCH_RUN</text>

  <!-- Peristaltic Pumps on Tower Front -->
  <circle cx="244" cy="272" r="13" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="283" cy="272" r="13" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="322" cy="272" r="13" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="283" y="298" text-anchor="middle" fill="#94a3b8" font-size="9">Base / Feed / Antifoam Pumps</text>

  <!-- Bottom Bulkhead Gland Plate with RJ45 Port -->
  <rect x="224" y="314" width="118" height="84" rx="5" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="283" y="331" text-anchor="middle" fill="#facc15" font-size="10" font-weight="700">Skid Network Bulkhead</text>
  <rect x="263" y="340" width="40" height="32" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="267" y="344" width="8" height="5" fill="#22c55e"/>
  <rect x="291" y="344" width="8" height="5" fill="#facc15"/>
  <text x="283" y="364" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">RJ45</text>
  <text x="283" y="390" text-anchor="middle" fill="#cbd5e1" font-size="9">Port X1 / EN2TR / ACN</text>

  <rect x="46" y="444" width="314" height="74" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="58" y="463" fill="#facc15" font-size="11" font-weight="700">Where to Plug In Your Ethernet Cable:</text>
  <text x="58" y="480" fill="#cbd5e1" font-size="10.5">• Locate the stainless utility bulkhead on the side/bottom</text>
  <text x="58" y="495" fill="#cbd5e1" font-size="10.5">  of the Figurate™ cabinet labeled &quot;PLANT NETWORK / L2.5&quot;.</text>
  <text x="58" y="510" fill="#cbd5e1" font-size="10.5">• Plug a shielded Cat6A RJ45 cable into the Supervisory port.</text>

  <!-- PANEL 2: PLC / DCS Hardware Inside Cabinet & Software Setup -->
  <rect x="400" y="90" width="356" height="444" rx="10" fill="#162032" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="424" cy="116" r="13" fill="#34d399"/>
  <text x="424" y="121" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">2</text>
  <text x="446" y="116" fill="#f8fafc" font-size="14" font-weight="700">Software Enablement (Click-by-Click)</text>
  <text x="446" y="133" fill="#34d399" font-size="11">Enable OPC UA Server on Figurate™ DeltaV or PlantPAx</text>

  <!-- Option A Box: Figurate DeltaV -->
  <rect x="418" y="152" width="320" height="164" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="432" y="173" fill="#38bdf8" font-size="12" font-weight="700">Option A: Figurate™ on Emerson DeltaV™</text>
  <text x="432" y="193" fill="#e2e8f0" font-size="10.5">1. Open <tspan fill="#facc15" font-weight="600">DeltaV Explorer</tspan> on the Application Station PC.</text>
  <text x="432" y="211" fill="#e2e8f0" font-size="10.5">2. Expand <tspan fill="#38bdf8" font-family="monospace">Physical Network → Application Station</tspan>.</text>
  <text x="432" y="229" fill="#e2e8f0" font-size="10.5">3. Right-click <tspan fill="#34d399" font-weight="600">DeltaV OPC UA Server → Properties</tspan>.</text>
  <text x="432" y="247" fill="#e2e8f0" font-size="10.5">4. Check <tspan fill="#34d399" font-weight="600">[✓] Enable OPC UA Server</tspan> on Port <tspan fill="#facc15" font-family="monospace">4840</tspan>.</text>
  <text x="432" y="265" fill="#e2e8f0" font-size="10.5">5. Security Policy: <tspan fill="#38bdf8" font-family="monospace">Basic256Sha256 (SignAndEncrypt)</tspan>.</text>
  <text x="432" y="283" fill="#e2e8f0" font-size="10.5">6. Trust the <tspan fill="#38bdf8" font-family="monospace">gxphistorian_client_cert.pem</tspan> certificate</text>
  <text x="432" y="299" fill="#94a3b8" font-size="10">   and click <tspan fill="#34d399" font-weight="600">Download</tspan> to activate.</text>

  <!-- Option B Box: Figurate PlantPAx -->
  <rect x="418" y="330" width="320" height="188" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="432" y="351" fill="#facc15" font-size="12" font-weight="700">Option B: Figurate™ on Rockwell PlantPAx®</text>
  <text x="432" y="371" fill="#e2e8f0" font-size="10.5">1. On the Figurate Server PC, open</text>
  <text x="432" y="387" fill="#facc15" font-weight="600" font-size="10.5">   FactoryTalk Administration Console</text>
  <text x="432" y="405" fill="#e2e8f0" font-size="10.5">2. Expand <tspan fill="#38bdf8" font-family="monospace">FactoryTalk Linx Gateway → Server Settings</tspan>.</text>
  <text x="432" y="423" fill="#e2e8f0" font-size="10.5">3. Go to the <tspan fill="#34d399" font-weight="600">OPC UA Server Endpoints</tspan> tab.</text>
  <text x="432" y="441" fill="#e2e8f0" font-size="10.5">4. Click <tspan fill="#34d399" font-weight="600">Add Endpoint</tspan> → Port <tspan fill="#facc15" font-family="monospace">4840</tspan>, select NIC facing</text>
  <text x="432" y="457" fill="#94a3b8" font-size="10">   the Cleanroom Historian VLAN (e.g., <tspan font-family="monospace">10.20.30.10</tspan>).</text>
  <text x="432" y="476" fill="#e2e8f0" font-size="10.5">5. Legacy OPC DA Only? Run <tspan fill="#34d399" font-family="monospace">opcda_windows_forwarder.py</tspan></text>
  <text x="432" y="492" fill="#94a3b8" font-size="10">   locally on the Windows PC → pushes HTTP to <tspan font-family="monospace">:8080/ingest</tspan>.</text>

  <!-- PANEL 3: GxPHistorian Verification -->
  <rect x="778" y="90" width="314" height="444" rx="10" fill="#162032" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="802" cy="116" r="13" fill="#38bdf8"/>
  <text x="802" y="121" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">3</text>
  <text x="824" y="116" fill="#f8fafc" font-size="14" font-weight="700">GxPHistorian Live Archive</text>
  <text x="824" y="133" fill="#38bdf8" font-size="11">1-Second Lossless Capture &amp; Batch Events</text>

  <!-- Arrows between panels -->
  <line x1="303" y1="356" x2="416" y2="235" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-b)"/>
  <line x1="738" y1="235" x2="794" y2="205" stroke="#34d399" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- Edge Collector Card -->
  <rect x="796" y="154" width="278" height="106" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="810" y="175" fill="#38bdf8" font-size="12" font-weight="700">Pillar 1: edge-collector</text>
  <text x="810" y="194" fill="#cbd5e1" font-size="10.5">• Polls <tspan font-family="monospace" fill="#facc15">opc.tcp://10.20.30.10:4840</tspan></text>
  <text x="810" y="211" fill="#cbd5e1" font-size="10.5">• Deadband: <tspan font-family="monospace">exc_dev=0.05°C, exc_max=10s</tspan></text>
  <text x="810" y="228" fill="#cbd5e1" font-size="10.5">• Disk WAL Buffer: <tspan font-family="monospace" fill="#34d399">1,000,000 metrics</tspan></text>
  <text x="810" y="245" fill="#94a3b8" font-size="10">  (Zero data loss during 14-day perfusion)</text>

  <!-- ClickHouse + Postgres Card -->
  <rect x="796" y="276" width="278" height="116" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="810" y="297" fill="#34d399" font-size="12" font-weight="700">Pillars 2 &amp; 3: Archive + Part 11</text>
  <text x="810" y="316" fill="#cbd5e1" font-size="10.5">• Asset Path: <tspan font-family="monospace" fill="#38bdf8">BioCorp.Fremont.USP.</tspan></text>
  <text x="818" y="331" fill="#38bdf8" font-size="10.5" font-family="monospace">Bioreactor_201</text>
  <text x="810" y="349" fill="#cbd5e1" font-size="10.5">• Auto Event Frame on <tspan font-family="monospace" fill="#f87171">TEMP &gt; 38.0°C</tspan></text>
  <text x="810" y="366" fill="#cbd5e1" font-size="10.5">• SHA-256 WORM Audit + QA E-Signature</text>
  <text x="810" y="382" fill="#94a3b8" font-size="10">  (<tspan font-family="monospace">POST /api/v1/event-frames/{id}/sign</tspan>)</text>

  <!-- Grafana + Excel Card -->
  <rect x="796" y="408" width="278" height="110" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="810" y="429" fill="#facc15" font-size="12" font-weight="700">Pillar 4: Operator HMI &amp; Excel</text>
  <text x="810" y="448" fill="#cbd5e1" font-size="10.5">• Grafana Vision (<tspan font-family="monospace" fill="#38bdf8">localhost:3020</tspan>):</text>
  <text x="818" y="463" fill="#94a3b8" font-size="10">LTTB vessel trends + shaded batch regions</text>
  <text x="810" y="481" fill="#cbd5e1" font-size="10.5">• Excel Formula (<tspan font-family="monospace" fill="#34d399">gxphistorian_datalink_udf</tspan>):</text>
  <text x="818" y="497" fill="#34d399" font-size="9.5" font-family="monospace">=GXPHISTORIAN_SAMPLED(&quot;BR201_TEMP_PV&quot;)</text>
</svg>
