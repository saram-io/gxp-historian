<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="560" rx="14" fill="url(#bg4)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">PAT Cell/Metabolite Analyzers &amp; In-Line Spectroscopy — Visual Setup Guide</text>
  <text x="32" y="60" fill="#94a3b8" font-size="13">Nova BioProfile® FLEX2 • Beckman Coulter Vi-CELL™ BLU • Roche Cedex® Bio HT • Endress+Hauser Raman Rxn2™ • Hamilton Arc®</text>
  <line x1="32" y1="74" x2="1088" y2="74" stroke="#334155" stroke-width="1"/>

  <!-- CARD 1: Nova BioProfile FLEX2 + Seg-Flow -->
  <rect x="28" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="50" cy="114" r="12" fill="#0284c7"/>
  <text x="50" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>
  <text x="68" y="114" fill="#f8fafc" font-size="13" font-weight="700">Nova BioProfile® FLEX2</text>
  <text x="68" y="130" fill="#38bdf8" font-size="10.5">Chemistry • Gas • CDV • Osmolality</text>

  <!-- FLEX2 Benchtop Analyzer Graphic -->
  <rect x="44" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Left Touchscreen -->
  <rect x="56" y="160" width="96" height="68" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="104" y="180" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">BioProfile FLEX2</text>
  <text x="104" y="196" text-anchor="middle" fill="#34d399" font-size="8.5">Gluc: 4.12 g/L</text>
  <text x="104" y="210" text-anchor="middle" fill="#facc15" font-size="8.5">VCD: 14.8 e6/mL</text>
  <!-- Right 96-Well / Syringe Autosampler Carousel -->
  <circle cx="206" cy="202" r="34" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="206" cy="202" r="16" fill="#1e293b" stroke="#34d399"/>
  <text x="206" y="252" text-anchor="middle" fill="#94a3b8" font-size="8.5">24-Pos Sample Tray</text>
  <text x="104" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Rear RJ45 LAN Port</text>
  <text x="156" y="274" text-anchor="middle" fill="#facc15" font-size="8.5">+ Optional Flownamics® Seg-Flow® 4800</text>

  <rect x="42" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="318" fill="#38bdf8" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="52" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Plug Cat6 Ethernet into</text>
  <text x="52" y="350" fill="#94a3b8" font-size="9.5">   the RJ45 port on the left-rear panel</text>
  <text x="52" y="364" fill="#94a3b8" font-size="9.5">   of the FLEX2 (next to the USB ports).</text>
  <text x="52" y="384" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">On FLEX2 Touchscreen:</tspan></text>
  <text x="52" y="398" fill="#94a3b8" font-size="9.5">   Log in as <tspan font-family="monospace">Admin → Setup → System</tspan></text>
  <text x="52" y="412" fill="#94a3b8" font-size="9.5">   <tspan font-family="monospace">Configuration → Network / OPC</tspan>.</text>
  <text x="52" y="426" fill="#94a3b8" font-size="9.5">   Check <tspan fill="#34d399" font-weight="600">[✓] Enable OPC Server</tspan> (Port</text>
  <text x="52" y="440" fill="#94a3b8" font-size="9.5">   <tspan fill="#facc15" font-family="monospace">4840</tspan>) AND <tspan fill="#34d399" font-weight="600">[✓] Auto CSV Export</tspan>.</text>
  <text x="52" y="460" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">GxPHistorian Tag Rule:</tspan></text>
  <text x="52" y="474" fill="#94a3b8" font-size="9.5">   Set <tspan fill="#facc15" font-family="monospace">is_step_tag = true</tspan> (LOCF) and</text>
  <text x="52" y="488" fill="#94a3b8" font-size="9.5">   <tspan fill="#facc15" font-family="monospace">exc_dev = 0.0</tspan> so every sparse</text>
  <text x="52" y="502" fill="#94a3b8" font-size="9.5">   assay sample is archived intact.</text>

  <!-- CARD 2: Beckman Coulter Vi-CELL BLU -->
  <rect x="296" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="318" cy="114" r="12" fill="#0d9488"/>
  <text x="318" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2</text>
  <text x="336" y="114" fill="#f8fafc" font-size="13" font-weight="700">Beckman Vi-CELL™ BLU</text>
  <text x="336" y="130" fill="#34d399" font-size="10.5">Trypan Blue Cell Viability &amp; VCD</text>

  <!-- Vi-CELL BLU Graphic -->
  <rect x="312" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="326" y="160" width="102" height="68" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="377" y="178" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">Vi-CELL™ BLU</text>
  <text x="377" y="194" text-anchor="middle" fill="#e2e8f0" font-size="8.5">Viability: 98.7%</text>
  <text x="377" y="208" text-anchor="middle" fill="#38bdf8" font-size="8.5">OPC UA :4840</text>
  <circle cx="480" cy="196" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="199" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">24-Carousel</text>
  <text x="424" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Rear Panel RJ45 Gigabit Ethernet</text>
  <text x="424" y="272" text-anchor="middle" fill="#94a3b8" font-size="8.5">Embedded 21 CFR Part 11 OPC UA Server</text>

  <rect x="310" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="320" y="318" fill="#34d399" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="320" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Plug a Cat6 RJ45 cable</text>
  <text x="320" y="350" fill="#94a3b8" font-size="9.5">   into the rear Ethernet port on the</text>
  <text x="320" y="364" fill="#94a3b8" font-size="9.5">   back of the Vi-CELL™ BLU PC bay.</text>
  <text x="320" y="384" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">In Vi-CELL BLU Software:</tspan></text>
  <text x="320" y="398" fill="#94a3b8" font-size="9.5">   Tap <tspan fill="#38bdf8" font-family="monospace">Menu (☰) → Configuration →</tspan></text>
  <text x="320" y="412" fill="#94a3b8" font-size="9.5">   <tspan fill="#38bdf8" font-family="monospace">System → Automation / OPC UA</tspan>.</text>
  <text x="320" y="426" fill="#94a3b8" font-size="9.5">   Toggle <tspan fill="#34d399" font-weight="600">Enable OPC UA = ON</tspan>,</text>
  <text x="320" y="440" fill="#94a3b8" font-size="9.5">   Port = <tspan fill="#facc15" font-family="monospace">4840</tspan>, set Automation User.</text>
  <text x="320" y="460" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Sample Naming Convention:</tspan></text>
  <text x="320" y="474" fill="#94a3b8" font-size="9.5">   Name samples <tspan fill="#facc15" font-family="monospace">BR201_D04_S1</tspan> so</text>
  <text x="320" y="488" fill="#94a3b8" font-size="9.5">   results route automatically to</text>
  <text x="320" y="502" fill="#94a3b8" font-size="9.5">   <tspan font-family="monospace">BioCorp.Fremont.USP.Bioreactor_201</tspan>.</text>

  <!-- CARD 3: Roche Cedex Bio HT -->
  <rect x="564" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="586" cy="114" r="12" fill="#f59e0b"/>
  <text x="586" y="118" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">3</text>
  <text x="604" y="114" fill="#f8fafc" font-size="13" font-weight="700">Roche Cedex® Bio HT</text>
  <text x="604" y="130" fill="#facc15" font-size="10.5">IgG Titer • Substrates • Metabolites</text>

  <!-- Cedex Bio HT Graphic -->
  <rect x="580" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="594" y="160" width="112" height="68" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="650" y="178" text-anchor="middle" fill="#facc15" font-size="9.5" font-weight="700">Cedex® Bio HT</text>
  <text x="650" y="194" text-anchor="middle" fill="#34d399" font-size="8.5">IGG2B: 4.85 g/L</text>
  <text x="650" y="208" text-anchor="middle" fill="#cbd5e1" font-size="8.5">LDHB: 42 U/L</text>
  <rect x="718" y="160" width="72" height="68" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="754" y="188" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">Control PC</text>
  <text x="754" y="204" text-anchor="middle" fill="#22c55e" font-size="8">SMB / CSV Drop</text>
  <text x="692" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Control PC RJ45 → SMB Watchfolder</text>
  <text x="692" y="272" text-anchor="middle" fill="#94a3b8" font-size="8.5">SHA-256 Verified CSV → :8080/ingest</text>

  <rect x="578" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="588" y="318" fill="#facc15" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="588" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Connect the Cedex®</text>
  <text x="588" y="350" fill="#94a3b8" font-size="9.5">   Control PC’s plant LAN RJ45 port</text>
  <text x="588" y="364" fill="#94a3b8" font-size="9.5">   to the Cleanroom switch (keep the</text>
  <text x="588" y="378" fill="#94a3b8" font-size="9.5">   analyzer-to-PC serial/LAN cable intact).</text>
  <text x="588" y="398" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">In Cedex Control Center:</tspan></text>
  <text x="588" y="412" fill="#94a3b8" font-size="9.5">   Open <tspan fill="#38bdf8" font-family="monospace">Utilities → System Config →</tspan></text>
  <text x="588" y="426" fill="#94a3b8" font-size="9.5">   <tspan fill="#38bdf8" font-family="monospace">Host / Data Export</tspan> and enable</text>
  <text x="588" y="440" fill="#94a3b8" font-size="9.5">   automatic result export to folder</text>
  <text x="588" y="454" fill="#94a3b8" font-size="9.5">   <tspan fill="#facc15" font-family="monospace">C:\CedexExport\Out</tspan>.</text>
  <text x="588" y="474" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Start Watchfolder Worker:</tspan></text>
  <text x="588" y="488" fill="#94a3b8" font-size="9.5">   Run the Python Cedex watchfolder</text>
  <text x="588" y="502" fill="#94a3b8" font-size="9.5">   script → posts to <tspan fill="#34d399" font-family="monospace">:8080/ingest</tspan>.</text>

  <!-- CARD 4: Raman Rxn2/Rxn4 & Hamilton Arc -->
  <rect x="832" y="90" width="260" height="444" rx="10" fill="#162032" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="854" cy="114" r="12" fill="#a855f7"/>
  <text x="854" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4</text>
  <text x="872" y="114" fill="#f8fafc" font-size="13" font-weight="700">Raman Rxn2™ &amp; Hamilton Arc®</text>
  <text x="872" y="130" fill="#c084fc" font-size="10.5">In-Line Spectroscopy &amp; Smart Probes</text>

  <!-- Raman + Hamilton Probe Graphic -->
  <rect x="848" y="146" width="228" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="860" y="160" width="108" height="68" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="914" y="177" text-anchor="middle" fill="#c084fc" font-size="9.5" font-weight="700">Raman Rxn2™</text>
  <!-- Raman Spectrum Curve -->
  <polyline points="868,214 880,212 890,192 900,210 914,185 925,208 940,196 958,214" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- Fiber Optic Probe + Hamilton VP8 Probe -->
  <rect x="980" y="160" width="84" height="68" rx="4" fill="#0f172a" stroke="#34d399"/>
  <text x="1022" y="177" text-anchor="middle" fill="#34d399" font-size="9" font-weight="700">Hamilton Arc®</text>
  <text x="1022" y="193" text-anchor="middle" fill="#cbd5e1" font-size="8">Incyte / VisiFerm</text>
  <text x="1022" y="209" text-anchor="middle" fill="#facc15" font-size="8">VP8 / Modbus</text>
  <text x="962" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Raman RJ45 (:4840) • Arc RS-485/TCP (:502)</text>
  <text x="962" y="272" text-anchor="middle" fill="#94a3b8" font-size="8.5">Continuous Real-Time (`is_step_tag = false`)</text>

  <rect x="846" y="298" width="232" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="856" y="318" fill="#c084fc" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="856" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Raman Rxn2/Rxn4 Physical:</tspan></text>
  <text x="856" y="350" fill="#94a3b8" font-size="9.5">   Plug Cat6A Ethernet into the rear</text>
  <text x="856" y="364" fill="#94a3b8" font-size="9.5">   <tspan fill="#22c55e" font-family="monospace">LAN 1</tspan> port on the Raman base unit.</text>
  <text x="856" y="382" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">In Raman RunTime™ / SIMCA:</tspan></text>
  <text x="856" y="396" fill="#94a3b8" font-size="9.5">   Open <tspan fill="#38bdf8" font-family="monospace">System → Automation → OPC UA</tspan></text>
  <text x="856" y="410" fill="#94a3b8" font-size="9.5">   and enable chemometric predictions</text>
  <text x="856" y="424" fill="#94a3b8" font-size="9.5">   + spectral health (<tspan font-family="monospace">Hotelling_T2, DModX</tspan>).</text>
  <text x="856" y="444" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Hamilton Arc® Smart Probes:</tspan></text>
  <text x="856" y="458" fill="#94a3b8" font-size="9.5">   Screw VP8 cable onto sensor head;</text>
  <text x="856" y="472" fill="#94a3b8" font-size="9.5">   wire RS-485 A/B to Moxa NPort (port</text>
  <text x="856" y="486" fill="#94a3b8" font-size="9.5">   <tspan fill="#facc15" font-family="monospace">4001</tspan>, <tspan font-family="monospace">byte_order=&quot;CDAB&quot;</tspan>) or OPC UA.</text>
</svg>
