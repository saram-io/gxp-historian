<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg-cold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="1100" height="620" rx="16" fill="url(#bg-cold)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="35" y="42" fill="#f8fafc" font-size="21" font-weight="800" letter-spacing="0.3">GMP STABILITY CHAMBERS, INCUBATORS, ULT COLD CHAIN &amp; STEAM AUTOCLAVES</text>
  <text x="35" y="65" fill="#94a3b8" font-size="13">Binder KBF / Weiss Stability (ICH Q1A MKT) • Infors / Heracell CO2 Incubators • -80°C ULT Freezers • Fedegari / Getinge Steam Sterilizers (F0)</text>

  <!-- Card 1: ICH Q1A Stability Chamber (Binder KBF / Weiss Technik) -->
  <g transform="translate(30, 88)">
    <rect width="248" height="285" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="248" height="36" rx="12" fill="#0c4a6e"/>
    <text x="124" y="23" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="700">1. ICH Q1A STABILITY CHAMBER</text>

    <!-- Chamber + Controller Graphic -->
    <g transform="translate(24, 46)">
      <rect x="0" y="0" width="110" height="118" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <!-- Controller Triangle Display -->
      <rect x="12" y="10" width="86" height="32" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="55" y="23" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">25.0 °C ± 2°C</text>
      <text x="55" y="36" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="700">60.0 %RH ± 5%</text>
      <!-- Shelves -->
      <line x1="12" y1="58" x2="98" y2="58" stroke="#64748b" stroke-width="2"/>
      <line x1="12" y1="80" x2="98" y2="80" stroke="#64748b" stroke-width="2"/>
      <line x1="12" y1="102" x2="98" y2="102" stroke="#64748b" stroke-width="2"/>
      <!-- Rear RJ45 Callout -->
      <rect x="122" y="18" width="78" height="82" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="161" y="36" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="700">REAR PANEL</text>
      <rect x="145" y="45" width="32" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="161" y="60" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="700">RJ45</text>
      <text x="161" y="84" text-anchor="middle" fill="#cbd5e1" font-size="8">Modbus TCP</text>
      <text x="161" y="95" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="700">Port 502</text>
    </g>

    <!-- Details -->
    <rect x="14" y="175" width="220" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="193" fill="#7dd3fc" font-size="11" font-weight="700">Binder KBF / Weiss / Caron:</text>
    <text x="24" y="210" fill="#cbd5e1" font-size="10">• Plug Cat6 into Rear Ethernet (X10)</text>
    <text x="24" y="225" fill="#cbd5e1" font-size="10">• Menu: Settings → Network → Modbus</text>
    <text x="24" y="240" fill="#cbd5e1" font-size="10">• Polls Temp (°C), Humidity (%RH), Door</text>
    <text x="24" y="255" fill="#38bdf8" font-size="10" font-weight="700">• Auto-calculates ICH Q1A MKT in SQL</text>
  </g>

  <!-- Card 2: GMP Shaker & CO2 Incubators (Infors HT / Thermo Heracell) -->
  <g transform="translate(294, 88)">
    <rect width="248" height="285" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="248" height="36" rx="12" fill="#064e3b"/>
    <text x="124" y="23" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="700">2. CO2 &amp; SHAKER INCUBATORS</text>

    <!-- Stacked Incubator Graphic -->
    <g transform="translate(24, 46)">
      <rect x="0" y="0" width="120" height="55" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="60" y="18" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="700">UPPER DECK (INFORS)</text>
      <text x="60" y="34" text-anchor="middle" fill="#10b981" font-size="9" font-weight="700">37.0°C | 5.0% CO2</text>
      <text x="60" y="47" text-anchor="middle" fill="#34d399" font-size="8">125 RPM | 85% RH</text>

      <rect x="0" y="62" width="120" height="55" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="60" y="80" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="700">LOWER DECK (HERACELL)</text>
      <text x="60" y="96" text-anchor="middle" fill="#10b981" font-size="9" font-weight="700">37.0°C | 5.0% CO2</text>
      <text x="60" y="109" text-anchor="middle" fill="#34d399" font-size="8">O2: 20.9% | Door Closed</text>

      <!-- Rear Interface Box -->
      <rect x="130" y="18" width="72" height="82" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="166" y="36" text-anchor="middle" fill="#6ee7b7" font-size="8" font-weight="700">INTERFACE</text>
      <text x="166" y="54" text-anchor="middle" fill="#cbd5e1" font-size="8">OPC UA (4840)</text>
      <text x="166" y="68" text-anchor="middle" fill="#94a3b8" font-size="8">or Rear RJ45</text>
      <text x="166" y="82" text-anchor="middle" fill="#10b981" font-size="8" font-weight="700">Modbus TCP</text>
    </g>

    <!-- Details -->
    <rect x="14" y="175" width="220" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="193" fill="#6ee7b7" font-size="11" font-weight="700">Infors Multitron / Thermo Heracell:</text>
    <text x="24" y="210" fill="#cbd5e1" font-size="10">• Infors HT: Enable onboard OPC UA</text>
    <text x="24" y="225" fill="#cbd5e1" font-size="10">  server on Touchscreen (Port 4840)</text>
    <text x="24" y="240" fill="#cbd5e1" font-size="10">• Thermo Heracell VIOS / Forma: Rear</text>
    <text x="24" y="255" fill="#34d399" font-size="10" font-weight="700">  RS-485 / USB → Moxa NPort Gateway</text>
  </g>

  <!-- Card 3: -80°C ULT Freezers & Independent PT100 Probes -->
  <g transform="translate(558, 88)">
    <rect width="248" height="285" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect width="248" height="36" rx="12" fill="#164e63"/>
    <text x="124" y="23" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="700">3. -80°C ULT &amp; COLD CHAIN</text>

    <!-- Freezer + Independent PT100 Probe Graphic -->
    <g transform="translate(24, 46)">
      <!-- Tall ULT Freezer -->
      <rect x="0" y="0" width="90" height="118" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
      <rect x="12" y="12" width="66" height="26" rx="3" fill="#083344"/>
      <text x="45" y="29" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="800">-80.4 °C</text>
      <!-- Independent PT100 Probe entering access port -->
      <circle cx="45" cy="70" r="5" fill="#f59e0b"/>
      <text x="45" y="88" text-anchor="middle" fill="#fcd34d" font-size="8" font-weight="700">Glycol PT100</text>
      <path d="M 50 70 L 118 70" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>

      <!-- Independent PoE / Wi-Fi Transmitter -->
      <rect x="118" y="22" width="84" height="82" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="160" y="38" text-anchor="middle" fill="#fde68a" font-size="8" font-weight="700">INDEPENDENT</text>
      <text x="160" y="50" text-anchor="middle" fill="#fde68a" font-size="8" font-weight="700">EMS TRANSMITTER</text>
      <text x="160" y="66" text-anchor="middle" fill="#cbd5e1" font-size="8">Vaisala / Monnit</text>
      <text x="160" y="79" text-anchor="middle" fill="#cbd5e1" font-size="8">Advantech ADAM</text>
      <text x="160" y="94" text-anchor="middle" fill="#22d3ee" font-size="8" font-weight="700">Modbus TCP 502</text>
    </g>

    <!-- Details -->
    <rect x="14" y="175" width="220" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="193" fill="#67e8f9" font-size="11" font-weight="700">Dual-Source GMP Cold Chain Rule:</text>
    <text x="24" y="210" fill="#cbd5e1" font-size="10">• Controller: PHCbi VIP ECO / Thermo TSX</text>
    <text x="24" y="225" fill="#cbd5e1" font-size="10">• QA Probe: Independent 4-wire PT100</text>
    <text x="24" y="240" fill="#cbd5e1" font-size="10">  routed through rear 25mm access port</text>
    <text x="24" y="255" fill="#22d3ee" font-size="10" font-weight="700">• Both logged to GxPHistorian simultaneously</text>
  </g>

  <!-- Card 4: Steam Sterilizers / Autoclaves (Fedegari / Getinge / Belimed) -->
  <g transform="translate(822, 88)">
    <rect width="248" height="285" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="248" height="36" rx="12" fill="#881337"/>
    <text x="124" y="23" text-anchor="middle" fill="#ffe4e6" font-size="12" font-weight="700">4. GMP STEAM AUTOCLAVES</text>

    <!-- Autoclave Chamber + Drain Probe Graphic -->
    <g transform="translate(24, 46)">
      <rect x="0" y="0" width="115" height="118" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
      <text x="57" y="18" text-anchor="middle" fill="#fda4af" font-size="9" font-weight="700">CHAMBER STERILIZE</text>
      <text x="57" y="38" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="800">121.4 °C</text>
      <text x="57" y="54" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="700">2.12 bar abs</text>
      <line x1="15" y1="66" x2="100" y2="66" stroke="#334155" stroke-width="1.5"/>
      <text x="57" y="82" text-anchor="middle" fill="#10b981" font-size="9" font-weight="700">Drain T: 121.2 °C</text>
      <text x="57" y="98" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="800">F0 = 18.6 min</text>

      <!-- PLC Box -->
      <rect x="125" y="18" width="77" height="82" rx="6" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="163" y="36" text-anchor="middle" fill="#fda4af" font-size="8" font-weight="700">STERILIZER PLC</text>
      <text x="163" y="52" text-anchor="middle" fill="#cbd5e1" font-size="8">Fedegari Thema4</text>
      <text x="163" y="66" text-anchor="middle" fill="#cbd5e1" font-size="8">Getinge PACS</text>
      <text x="163" y="80" text-anchor="middle" fill="#cbd5e1" font-size="8">S7-1500 / AB</text>
      <text x="163" y="94" text-anchor="middle" fill="#fb7185" font-size="8" font-weight="700">OPC UA 4840</text>
    </g>

    <!-- Details -->
    <rect x="14" y="175" width="220" height="96" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="24" y="193" fill="#fda4af" font-size="11" font-weight="700">Fedegari / Getinge / Belimed:</text>
    <text x="24" y="210" fill="#cbd5e1" font-size="10">• Plug Cat6A into Service Fascia RJ45</text>
    <text x="24" y="225" fill="#cbd5e1" font-size="10">• 1 Hz High-Speed Polling during Hold</text>
    <text x="24" y="240" fill="#cbd5e1" font-size="10">• Tracks Drain RTD, Load Probes, Press</text>
    <text x="24" y="255" fill="#fb7185" font-size="10" font-weight="700">• Real-Time F0 Lethality Integration</text>
  </g>

  <!-- Convergence Lines to Edge Collector -->
  <path d="M 154 373 L 154 415 L 400 415 L 400 440" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-sky)"/>
  <path d="M 418 373 L 418 440" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 682 373 L 682 440" fill="none" stroke="#06b6d4" stroke-width="2.5" marker-end="url(#arr-cyan)"/>
  <path d="M 946 373 L 946 415 L 700 415 L 700 440" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arr-rose)"/>

  <!-- Bottom Bar: GxPHistorian ICH Q1A MKT & F0 Lethality Engine -->
  <g transform="translate(30, 445)">
    <rect width="1040" height="145" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="1040" height="34" rx="12" fill="#0284c7"/>
    <text x="520" y="22" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">GXPHISTORIAN AUTOMATED ICH Q1A MEAN KINETIC TEMPERATURE (MKT) &amp; F0 STERILIZATION ENGINE</text>

    <!-- 3 Feature Pillars -->
    <g transform="translate(20, 46)">
      <rect width="335" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#38bdf8" font-size="11" font-weight="700">ICH Q1A(R2) Mean Kinetic Temperature (MKT)</text>
      <text x="14" y="38" fill="#cbd5e1" font-size="10">• ClickHouse native Arrhenius equation (`ΔH = 83.144 kJ/mol`)</text>
      <text x="14" y="53" fill="#cbd5e1" font-size="10">• Evaluates thermal stress of brief door-openings accurately</text>
      <text x="14" y="68" fill="#7dd3fc" font-size="10" font-weight="700">• Instant Excel report via `=GXPHISTORIAN_SAMPLED()`</text>
    </g>

    <g transform="translate(372, 46)">
      <rect width="315" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#06b6d4" font-size="11" font-weight="700">Controller vs. Independent Probe Drift Alert</text>
      <text x="14" y="38" fill="#cbd5e1" font-size="10">• Compares ULT Freezer display vs independent QA PT100</text>
      <text x="14" y="53" fill="#cbd5e1" font-size="10">• Triggers calibration warning if `|T_ctrl - T_qa| &gt; 1.5 °C`</text>
      <text x="14" y="68" fill="#67e8f9" font-size="10" font-weight="700">• Prevents lost stability batches from sensor drift</text>
    </g>

    <g transform="translate(705, 46)">
      <rect width="315" height="84" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" fill="#f43f5e" font-size="11" font-weight="700">Autoclave F0 Lethality &amp; Saturated Steam Check</text>
      <text x="14" y="38" fill="#cbd5e1" font-size="10">• Integrates `F0 = Σ Δt · 10^((T - 121.1)/10)` across Hold</text>
      <text x="14" y="53" fill="#cbd5e1" font-size="10">• EN 285 theoretical steam saturation temp vs pressure check</text>
      <text x="14" y="68" fill="#fda4af" font-size="10" font-weight="700">• Automatic Cycle Event Frame + Part 11 QA Sign-off</text>
    </g>
  </g>
</svg>
