# =============================================================================
# telegraf-clickhouse.conf
# Pillar 1: Multi-Protocol Edge Collector with Disk-Backed Store-and-Forward WAL
# =============================================================================

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 1000000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  buffer_strategy = "disk"
  buffer_directory = "/var/lib/telegraf/buffer"
  omit_hostname = true

# 1. HTTP Batch Ingestion Listener (Windows OPC DA Bridge, BACnet Workers, PLC Forwarders)
[[inputs.http_listener_v2]]
  service_address = ":8080"
  paths = ["/ingest"]
  methods = ["POST", "PUT"]
  read_timeout = "10s"
  write_timeout = "10s"
  max_body_size = "10MB"
  data_format = "json"
  tag_keys = ["tag_id"]
  json_string_fields = ["str_val", "ts"]

# 2. Multi-Protocol Plant Simulator & Stage 1 Exception/Deadband Filter Worker
[[inputs.execd]]
  command = ["python3", "-u", "/etc/telegraf/scripts/multi_protocol_simulator.py"]
  signal = "none"
  restart_delay = "2s"
  data_format = "influx"

# 3. ClickHouse HTTP JSONEachRow Output Sink (Supports On-Prem or Hybrid Cloud HTTPS Endpoint)
[[outputs.http]]
  url = "${CH_INGEST_URL:-http://clickhouse-archive:8123/?query=INSERT%20INTO%20pi_historian.sensor_data%20FORMAT%20JSONEachRow}"
  method = "POST"
  timeout = "5s"
  username = "${CH_USER}"
  password = "${CH_PASSWORD}"
  use_batch_format = false
  data_format = "json"
  json_timestamp_units = "1ms"
  json_transformation = "{\"tag_id\": $exists(fields.tag_id) ? $number(fields.tag_id) : $number(tags.tag_id), \"ts\": $exists(fields.ts) ? fields.ts : timestamp, \"val\": fields.val, \"str_val\": $exists(fields.str_val) ? $string(fields.str_val) : \"\", \"quality\": $exists(fields.quality) ? fields.quality : 192, \"status_code\": $exists(fields.status_code) ? fields.status_code : 0}"

  [outputs.http.headers]
    Content-Type = "application/json"
