# =============================================================================
# deploy/hybrid-cloud/telegraf-hybrid-dualwrite.conf
# Pattern C: Multi-Site Hub & Spoke Dual-Write Configuration
# Simultaneously writes normalized GxP telemetry to:
#   1. On-Premises Purdue Level 3 ClickHouse (zero-WAN-dependency local plant core)
#   2. Cloud Enterprise Aggregator in AWS / Azure / GCP over HTTPS mTLS (:8443)
# Each [[outputs.http]] block maintains its own independent disk WAL buffer queue
# so a WAN outage never blocks or slows local plant data collection.
# =============================================================================

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 5000000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  buffer_strategy = "disk"
  buffer_directory = "/var/lib/telegraf/buffer"
  omit_hostname = true

# 1. HTTP Batch Ingestion Listener (Windows OPC DA Bridge, BACnet Workers, PLC Forwarders)
[[inputs.http_listener_v2]]
  service_address = ":8080"
  paths = ["/ingest"]
  methods = ["POST", "PUT"]
  read_timeout = "10s"
  write_timeout = "10s"
  max_body_size = "10MB"
  data_format = "json"
  tag_keys = ["tag_id"]
  json_string_fields = ["str_val", "ts"]

# 2. Multi-Protocol Plant Collector & Stage 1 Exception/Deadband Filter Worker
[[inputs.execd]]
  command = ["python3", "-u", "/etc/telegraf/scripts/multi_protocol_simulator.py"]
  signal = "none"
  restart_delay = "2s"
  data_format = "influx"

# 3A. Primary Sink: Local On-Premises Purdue Level 3 ClickHouse Archive
[[outputs.http]]
  alias = "onprem_level3_clickhouse"
  url = "${CH_LOCAL_INGEST_URL:-http://clickhouse-archive:8123/?query=INSERT%20INTO%20pi_historian.sensor_data%20FORMAT%20JSONEachRow}"
  method = "POST"
  timeout = "5s"
  username = "${CH_USER}"
  password = "${CH_PASSWORD}"
  use_batch_format = false
  data_format = "json"
  json_timestamp_units = "1ms"
  json_transformation = "{\"tag_id\": $exists(fields.tag_id) ? $number(fields.tag_id) : $number(tags.tag_id), \"ts\": $exists(fields.ts) ? fields.ts : timestamp, \"val\": fields.val, \"str_val\": $exists(fields.str_val) ? $string(fields.str_val) : \"\", \"quality\": $exists(fields.quality) ? fields.quality : 192, \"status_code\": $exists(fields.status_code) ? fields.status_code : 0}"

  [outputs.http.headers]
    Content-Type = "application/json"

# 3B. Secondary Sink: Cloud Enterprise ClickHouse Hub (AWS / Azure / GCP via VPN / PrivateLink)
[[outputs.http]]
  alias = "cloud_enterprise_clickhouse_hub"
  url = "${CH_CLOUD_INGEST_URL:-https://clickhouse-hub.biocorp.cloud.internal:8443/?query=INSERT%20INTO%20pi_historian.sensor_data%20FORMAT%20JSONEachRow}"
  method = "POST"
  timeout = "15s"
  username = "${CH_CLOUD_USER}"
  password = "${CH_CLOUD_PASSWORD}"
  tls_ca = "/etc/telegraf/certs/biocorp-root-ca.pem"
  tls_cert = "/etc/telegraf/certs/edge-collector-client.pem"
  tls_key = "/etc/telegraf/certs/edge-collector-client.key"
  use_batch_format = false
  data_format = "json"
  json_timestamp_units = "1ms"
  json_transformation = "{\"tag_id\": $exists(fields.tag_id) ? $number(fields.tag_id) : $number(tags.tag_id), \"ts\": $exists(fields.ts) ? fields.ts : timestamp, \"val\": fields.val, \"str_val\": $exists(fields.str_val) ? $string(fields.str_val) : \"\", \"quality\": $exists(fields.quality) ? fields.quality : 192, \"status_code\": $exists(fields.status_code) ? fields.status_code : 0}"

  [outputs.http.headers]
    Content-Type = "application/json"
