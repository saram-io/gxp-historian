<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="560" rx="14" fill="url(#bg6)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">Cell &amp; Gene Therapy (CAR-T / Viral Vector) &amp; mRNA-LNP Instruments — Visual Setup Guide</text>
  <text x="32" y="60" fill="#94a3b8" font-size="13">Miltenyi CliniMACS Prodigy® • Cytiva Sefia™ / Sepax™ C-Pro • NanoAssemblr™ GMP LNP System • Planer Kryo 560 / CryoMed™ CRF</text>
  <line x1="32" y1="74" x2="1088" y2="74" stroke="#334155" stroke-width="1"/>

  <!-- CARD 1: Miltenyi CliniMACS Prodigy -->
  <rect x="28" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="50" cy="114" r="12" fill="#0284c7"/>
  <text x="50" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>
  <text x="68" y="114" fill="#f8fafc" font-size="13" font-weight="700">CliniMACS Prodigy®</text>
  <text x="68" y="130" fill="#38bdf8" font-size="10.5">Closed CAR-T Cell Manufacturing</text>

  <!-- CliniMACS Prodigy Benchtop Drawing -->
  <rect x="44" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- CentriCult Chamber (Right Round Unit) -->
  <circle cx="212" cy="200" r="34" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <circle cx="212" cy="200" r="16" fill="#1e293b" stroke="#facc15"/>
  <text x="212" y="248" text-anchor="middle" fill="#f87171" font-size="8" font-weight="700">CentriCult™ 37.0°C</text>
  <!-- Touchscreen + Pinch Valve Matrix + Magnetic MACS Column -->
  <rect x="56" y="160" width="104" height="68" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="108" y="178" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">Prodigy® HMI</text>
  <text x="108" y="194" text-anchor="middle" fill="#34d399" font-size="8.5">Phase: TRANSDUCTION</text>
  <text x="108" y="208" text-anchor="middle" fill="#facc15" font-size="8.5">CO2: 5.0% • 1800 RPM</text>
  <text x="156" y="272" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Rear Panel RJ45 Ethernet → OPC UA :4840</text>

  <rect x="42" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="318" fill="#38bdf8" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="52" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Plug a Cat6A RJ45 cable</text>
  <text x="52" y="350" fill="#94a3b8" font-size="9.5">   into the rear Ethernet port on the</text>
  <text x="52" y="364" fill="#94a3b8" font-size="9.5">   back of the CliniMACS Prodigy®.</text>
  <text x="52" y="384" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">On Prodigy Touchscreen:</tspan></text>
  <text x="52" y="398" fill="#94a3b8" font-size="9.5">   Go to <tspan fill="#38bdf8" font-family="monospace">Settings → Network &amp; Connectivity</tspan></text>
  <text x="52" y="412" fill="#94a3b8" font-size="9.5">   <tspan fill="#38bdf8" font-family="monospace">→ OPC UA Server</tspan>, toggle <tspan fill="#34d399">Active</tspan>,</text>
  <text x="52" y="426" fill="#94a3b8" font-size="9.5">   and import the GxPHistorian client cert.</text>
  <text x="52" y="446" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Chain-of-Identity (COI) Tracking:</tspan></text>
  <text x="52" y="460" fill="#94a3b8" font-size="9.5">   Archive <tspan fill="#facc15" font-family="monospace">Patient_COI_ID</tspan> &amp; <tspan font-family="monospace">TubingSet_Barcode</tspan></text>
  <text x="52" y="474" fill="#94a3b8" font-size="9.5">   in <tspan font-family="monospace">str_val</tspan> alongside CentriCult</text>
  <text x="52" y="488" fill="#94a3b8" font-size="9.5">   Temp, CO2 %, Camera Layer &amp; RPM.</text>

  <!-- CARD 2: Cytiva Sefia / Sepax C-Pro & Terumo Quantum -->
  <rect x="296" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="318" cy="114" r="12" fill="#0d9488"/>
  <text x="318" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2</text>
  <text x="336" y="114" fill="#f8fafc" font-size="13" font-weight="700">Cytiva Sefia™ / Sepax™ C-Pro</text>
  <text x="336" y="130" fill="#34d399" font-size="10.5">&amp; Terumo BCT Quantum® Expansion</text>

  <!-- Sepax / Sefia Drawing -->
  <rect x="312" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="326" y="160" width="102" height="68" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="377" y="178" text-anchor="middle" fill="#34d399" font-size="9.5" font-weight="700">Sefia™ S-2000</text>
  <text x="377" y="194" text-anchor="middle" fill="#e2e8f0" font-size="8.5">Protocol: FlexCell</text>
  <text x="377" y="208" text-anchor="middle" fill="#38bdf8" font-size="8.5">Bowl: 400 × g</text>
  <!-- Separation Chamber & Hanging Bags -->
  <circle cx="478" cy="196" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="478" y="199" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="700">Syringe Bowl</text>
  <text x="424" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Rear RJ45 Ethernet → OPC UA / TraceFile Drop</text>
  <text x="424" y="272" text-anchor="middle" fill="#94a3b8" font-size="8.5">Optical Line Sensor + Chamber Pressure + Weight</text>

  <rect x="310" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="320" y="318" fill="#34d399" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="320" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Connect Cat6A Ethernet</text>
  <text x="320" y="350" fill="#94a3b8" font-size="9.5">   to the RJ45 port under the rear</text>
  <text x="320" y="364" fill="#94a3b8" font-size="9.5">   protective cover of Sefia™ / Sepax™</text>
  <text x="320" y="378" fill="#94a3b8" font-size="9.5">   C-Pro or Terumo Quantum®.</text>
  <text x="320" y="398" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">On Instrument Touchscreen:</tspan></text>
  <text x="320" y="412" fill="#94a3b8" font-size="9.5">   Open <tspan fill="#38bdf8" font-family="monospace">Admin → Network Settings</tspan>,</text>
  <text x="320" y="426" fill="#94a3b8" font-size="9.5">   set Static IP, and configure automatic</text>
  <text x="320" y="440" fill="#94a3b8" font-size="9.5">   signed run trace export / OPC UA.</text>
  <text x="320" y="460" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Barcode Scanner Attribution:</tspan></text>
  <text x="320" y="474" fill="#94a3b8" font-size="9.5">   Handheld barcode scans of Kit Lot,</text>
  <text x="320" y="488" fill="#94a3b8" font-size="9.5">   Operator ID, and Patient Bag ID are</text>
  <text x="320" y="502" fill="#94a3b8" font-size="9.5">   captured in the Batch Event Frame.</text>

  <!-- CARD 3: NanoAssemblr GMP mRNA-LNP Skid -->
  <rect x="564" y="90" width="256" height="444" rx="10" fill="#162032" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="586" cy="114" r="12" fill="#f59e0b"/>
  <text x="586" y="118" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">3</text>
  <text x="604" y="114" fill="#f8fafc" font-size="13" font-weight="700">NanoAssemblr™ GMP System</text>
  <text x="604" y="130" fill="#facc15" font-size="10.5">mRNA-LNP Microfluidic Encapsulation</text>

  <!-- NanoAssemblr Microfluidic T-Mixer Drawing -->
  <rect x="580" y="146" width="224" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Pump A (mRNA Aqueous) & Pump B (Lipid Ethanol) -->
  <circle cx="614" cy="178" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="614" y="181" text-anchor="middle" fill="#38bdf8" font-size="7.5" font-weight="700">mRNA</text>
  <circle cx="614" cy="222" r="16" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="614" y="225" text-anchor="middle" fill="#facc15" font-size="7.5" font-weight="700">Lipid</text>
  <!-- NxGen Microfluidic Cartridge -->
  <line x1="630" y1="178" x2="668" y2="200" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="630" y1="222" x2="668" y2="200" stroke="#facc15" stroke-width="2.5"/>
  <rect x="668" y="182" width="66" height="36" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="701" y="198" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="700">NxGen™</text>
  <text x="701" y="210" text-anchor="middle" fill="#cbd5e1" font-size="7.5">FRR = 3.0 : 1</text>
  <line x1="734" y1="200" x2="784" y2="200" stroke="#34d399" stroke-width="3"/>
  <circle cx="784" cy="200" r="8" fill="#22c55e"/>
  <text x="692" y="252" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">Siemens S7-1500 / PlantPAx RJ45 (:4840)</text>
  <text x="692" y="272" text-anchor="middle" fill="#94a3b8" font-size="8.5">TFR (mL/min) • FRR Ratio • Diverter Valve</text>

  <rect x="578" y="298" width="228" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="588" y="318" fill="#facc15" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="588" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Connect Cat6A Ethernet</text>
  <text x="588" y="350" fill="#94a3b8" font-size="9.5">   to the NanoAssemblr™ GMP Fluid Path</text>
  <text x="588" y="364" fill="#94a3b8" font-size="9.5">   Control Cabinet <tspan fill="#22c55e" font-family="monospace">X2 Plant Network</tspan> RJ45.</text>
  <text x="588" y="384" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">Critical LNP CPPs to Archive (100ms–1s):</tspan></text>
  <text x="588" y="398" fill="#94a3b8" font-size="9.5">   • Aqueous mRNA Flow (<tspan font-family="monospace">mL/min</tspan>)</text>
  <text x="588" y="412" fill="#94a3b8" font-size="9.5">   • Organic Lipid Flow (<tspan font-family="monospace">mL/min</tspan>)</text>
  <text x="588" y="426" fill="#94a3b8" font-size="9.5">   • Flow Rate Ratio (<tspan fill="#facc15" font-family="monospace">FRR = 3.00 ± 0.05</tspan>)</text>
  <text x="588" y="440" fill="#94a3b8" font-size="9.5">   • Total Flow Rate (<tspan font-family="monospace">TFR</tspan>) &amp; Inline Pressure</text>
  <text x="588" y="454" fill="#94a3b8" font-size="9.5">   • Product/Waste Diverter Valve (<tspan font-family="monospace">LOCF</tspan>)</text>
  <text x="588" y="474" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">why FRR determines LNP size:</tspan></text>
  <text x="588" y="488" fill="#94a3b8" font-size="9.5">   Any FRR dip shifts LNP Z-average</text>
  <text x="588" y="502" fill="#94a3b8" font-size="9.5">   particle diameter (target <tspan font-family="monospace">60–90 nm</tspan>).</text>

  <!-- CARD 4: Controlled-Rate Freezer (CRF) & LN2 Cryo -->
  <rect x="832" y="90" width="260" height="444" rx="10" fill="#162032" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="854" cy="114" r="12" fill="#a855f7"/>
  <text x="854" y="118" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4</text>
  <text x="872" y="114" fill="#f8fafc" font-size="13" font-weight="700">Controlled-Rate Freezer</text>
  <text x="872" y="130" fill="#c084fc" font-size="10.5">Planer Kryo 560 • Thermo CryoMed™</text>

  <!-- CRF Freezing Curve Graphic -->
  <rect x="848" y="146" width="228" height="140" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="862" y="158" width="200" height="86" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="962" y="173" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="700">CAR-T Cryopreservation Profile (-1°C/min)</text>
  <!-- Freezing curve with latent heat nucleation dip -->
  <polyline points="872,182 905,196 918,214 926,202 945,216 995,232 1050,236" fill="none" stroke="#34d399" stroke-width="2.2"/>
  <polyline points="872,182 905,196 922,226 935,214 995,232 1050,236" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="962" y="260" text-anchor="middle" fill="#22c55e" font-size="8.5" font-weight="700">DB9 Serial / Moxa NPort or OPC UA (:4840)</text>
  <text x="962" y="276" text-anchor="middle" fill="#94a3b8" font-size="8.5">Sample Probe vs Chamber Temp (°C to -190°C)</text>

  <rect x="846" y="298" width="232" height="220" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="856" y="318" fill="#c084fc" font-size="11" font-weight="700">Physical &amp; Software Steps:</text>
  <text x="856" y="336" fill="#cbd5e1" font-size="10">1. <tspan fill="#facc15" font-weight="600">Physical:</tspan> Connect the rear RJ45</text>
  <text x="856" y="350" fill="#94a3b8" font-size="9.5">   Ethernet port (or DB9 RS-232 port via</text>
  <text x="856" y="364" fill="#94a3b8" font-size="9.5">   Moxa NPort 5110) on the Planer</text>
  <text x="856" y="378" fill="#94a3b8" font-size="9.5">   MRV / DeltaT controller or CryoMed™.</text>
  <text x="856" y="398" fill="#cbd5e1" font-size="10">2. <tspan fill="#34d399" font-weight="600">1-Second Latent Heat Capture:</tspan></text>
  <text x="856" y="412" fill="#94a3b8" font-size="9.5">   Poll <tspan font-family="monospace">Sample_Temp_C</tspan> and <tspan font-family="monospace">Chamber_Temp_C</tspan></text>
  <text x="856" y="426" fill="#94a3b8" font-size="9.5">   at <tspan fill="#facc15" font-family="monospace">1.0 s</tspan> so the LN2 blast compensating</text>
  <text x="856" y="440" fill="#94a3b8" font-size="9.5">   for ice-nucleation latent heat release</text>
  <text x="856" y="454" fill="#94a3b8" font-size="9.5">   around <tspan font-family="monospace">-4°C to -12°C</tspan> is proven on</text>
  <text x="856" y="468" fill="#94a3b8" font-size="9.5">   the patient’s CAR-T batch record.</text>
  <text x="856" y="488" fill="#cbd5e1" font-size="10">3. <tspan fill="#38bdf8" font-weight="600">Chart MVE LN2 Vapor Freezers:</tspan></text>
  <text x="856" y="502" fill="#94a3b8" font-size="9.5">   Poll TEC 3000 Modbus TCP (<tspan font-family="monospace">:502</tspan>).</text>
</svg>
