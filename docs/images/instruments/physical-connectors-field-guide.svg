<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#141e30"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1120" height="580" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-size="19" font-weight="700">Visual Field Guide: Physical Ports, Cables &amp; Adapters on Biopharma Instruments</text>
  <text x="32" y="60" fill="#94a3b8" font-size="13">How to visually identify the physical port on the back of your lab or cleanroom instrument and pick the right cable/gateway for GxPHistorian</text>
  <line x1="32" y1="74" x2="1088" y2="74" stroke="#334155" stroke-width="1"/>

  <!-- CARD 1: RJ45 Industrial Ethernet -->
  <rect x="28" y="90" width="332" height="222" rx="10" fill="url(#card)" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="52" cy="114" r="13" fill="#0284c7"/>
  <text x="52" y="119" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">1</text>
  <text x="74" y="114" fill="#e2e8f0" font-size="14" font-weight="700">RJ45 Ethernet Port (8P8C)</text>
  <text x="74" y="131" fill="#38bdf8" font-size="11" font-weight="600">OPC UA (:4840) • Modbus TCP (:502) • BACnet/IP • S7comm</text>

  <!-- RJ45 Socket Graphic -->
  <rect x="48" y="146" width="96" height="82" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <!-- Green & Amber LEDs -->
  <rect x="58" y="154" width="18" height="10" rx="2" fill="#22c55e"/>
  <text x="67" y="162" text-anchor="middle" fill="#052e16" font-size="7" font-weight="700">LNK</text>
  <rect x="116" y="154" width="18" height="10" rx="2" fill="#facc15"/>
  <text x="125" y="162" text-anchor="middle" fill="#422006" font-size="7" font-weight="700">ACT</text>
  <!-- RJ45 Cutout -->
  <path d="M64 172 H128 V210 H112 V218 H80 V210 H64 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 8 Gold Pins -->
  <line x1="72" y1="172" x2="72" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="79" y1="172" x2="79" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="86" y1="172" x2="86" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="93" y1="172" x2="93" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="100" y1="172" x2="100" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="107" y1="172" x2="107" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="114" y1="172" x2="114" y2="188" stroke="#facc15" stroke-width="2"/>
  <line x1="121" y1="172" x2="121" y2="188" stroke="#facc15" stroke-width="2"/>

  <text x="158" y="158" fill="#cbd5e1" font-size="11" font-weight="600">What You Need:</text>
  <text x="158" y="175" fill="#94a3b8" font-size="11">• Standard Shielded Cat6 / Cat6A</text>
  <text x="158" y="190" fill="#94a3b8" font-size="11">  Ethernet patch cable (RJ45).</text>
  <text x="158" y="207" fill="#94a3b8" font-size="11">• Plug directly into Cleanroom</text>
  <text x="158" y="222" fill="#94a3b8" font-size="11">  Level 2 Switch → GxPHistorian.</text>
  <rect x="46" y="240" width="296" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="56" y="258" fill="#38bdf8" font-size="11" font-weight="600">Found On:</text>
  <text x="56" y="274" fill="#cbd5e1" font-size="10.5">Cytiva Figurate/ÄKTA, Sartorius Biostat STR/Ambr, Vi-CELL BLU,</text>
  <text x="56" y="289" fill="#cbd5e1" font-size="10.5">CliniMACS Prodigy, Sievers M9 TOC, PMS LasAir III, Binder KBF</text>

  <!-- CARD 2: M12 Industrial Washdown Ethernet -->
  <rect x="380" y="90" width="352" height="222" rx="10" fill="url(#card)" stroke="#0d9488" stroke-width="1.5"/>
  <circle cx="404" cy="114" r="13" fill="#0d9488"/>
  <text x="404" y="119" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">2</text>
  <text x="426" y="114" fill="#e2e8f0" font-size="14" font-weight="700">M12 Circular Washdown Port (IP67)</text>
  <text x="426" y="131" fill="#34d399" font-size="11" font-weight="600">D-Coded (4-Pin 100Mbps) or X-Coded (8-Pin 1Gbps) + M12-to-RJ45</text>

  <!-- M12 Circular Socket Graphic -->
  <circle cx="448" cy="187" r="40" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="448" cy="187" r="27" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <!-- X-coding divider -->
  <line x1="432" y1="171" x2="464" y2="203" stroke="#64748b" stroke-width="2"/>
  <line x1="464" y1="171" x2="432" y2="203" stroke="#64748b" stroke-width="2"/>
  <circle cx="448" cy="167" r="3" fill="#facc15"/>
  <circle cx="448" cy="207" r="3" fill="#facc15"/>
  <circle cx="428" cy="187" r="3" fill="#facc15"/>
  <circle cx="468" cy="187" r="3" fill="#facc15"/>
  <circle cx="436" cy="175" r="2.5" fill="#facc15"/>
  <circle cx="460" cy="175" r="2.5" fill="#facc15"/>
  <circle cx="436" cy="199" r="2.5" fill="#facc15"/>
  <circle cx="460" cy="199" r="2.5" fill="#facc15"/>

  <text x="502" y="158" fill="#cbd5e1" font-size="11" font-weight="600">What You Need:</text>
  <text x="502" y="175" fill="#94a3b8" font-size="11">• M12 Male Screw-Lock to Standard</text>
  <text x="502" y="190" fill="#94a3b8" font-size="11">  RJ45 Male Adapter Cable (Cat6A).</text>
  <text x="502" y="207" fill="#94a3b8" font-size="11">• Match D-Code (4-pin) or X-Code</text>
  <text x="502" y="222" fill="#94a3b8" font-size="11">  (8-pin) keyway on skid bulkhead.</text>
  <rect x="398" y="240" width="316" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="408" y="258" fill="#34d399" font-size="11" font-weight="600">Found On:</text>
  <text x="408" y="274" fill="#cbd5e1" font-size="10.5">Stainless washdown mobile TFF skids, Sartoflow Modular,</text>
  <text x="408" y="289" fill="#cbd5e1" font-size="10.5">Hamilton Arc VP8 sensor cables, floor scale washdown terminals</text>

  <!-- CARD 3: DB9 RS-232 Serial Port -->
  <rect x="752" y="90" width="340" height="222" rx="10" fill="url(#card)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="776" cy="114" r="13" fill="#f59e0b"/>
  <text x="776" y="119" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">3</text>
  <text x="798" y="114" fill="#e2e8f0" font-size="14" font-weight="700">DB9 RS-232 Serial Port (9-Pin)</text>
  <text x="798" y="131" fill="#facc15" font-size="11" font-weight="600">MT-SICS • ASTM E1394 • ASCII Tickets → Moxa NPort</text>

  <!-- DB9 D-Sub Graphic -->
  <rect x="768" y="148" width="118" height="78" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="784,162 870,162 862,202 792,202" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <!-- Top 5 pins (1..5) -->
  <circle cx="798" cy="175" r="3" fill="#94a3b8"/>
  <circle cx="812" cy="175" r="3.5" fill="#38bdf8"/>
  <circle cx="827" cy="175" r="3.5" fill="#34d399"/>
  <circle cx="842" cy="175" r="3" fill="#94a3b8"/>
  <circle cx="856" cy="175" r="3.5" fill="#facc15"/>
  <!-- Bottom 4 pins (6..9) -->
  <circle cx="805" cy="191" r="3" fill="#94a3b8"/>
  <circle cx="820" cy="191" r="3" fill="#94a3b8"/>
  <circle cx="835" cy="191" r="3" fill="#94a3b8"/>
  <circle cx="850" cy="191" r="3" fill="#94a3b8"/>
  <text x="827" y="217" text-anchor="middle" fill="#facc15" font-size="9.5" font-weight="600">Pin 2=RX • Pin 3=TX • Pin 5=GND</text>

  <text x="896" y="156" fill="#cbd5e1" font-size="11" font-weight="600">What You Need:</text>
  <text x="896" y="172" fill="#94a3b8" font-size="10.5">• DB9 Serial Cable (Null-</text>
  <text x="896" y="186" fill="#94a3b8" font-size="10.5">  Modem swaps Pins 2 &amp; 3)</text>
  <text x="896" y="202" fill="#94a3b8" font-size="10.5">• Moxa NPort 5110/5150</text>
  <text x="896" y="216" fill="#94a3b8" font-size="10.5">  Serial-to-Ethernet Box</text>
  <text x="896" y="230" fill="#94a3b8" font-size="10.5">  (TCP Server Port 4001).</text>
  <rect x="768" y="240" width="308" height="58" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="778" y="258" fill="#facc15" font-size="11" font-weight="600">Found On:</text>
  <text x="778" y="274" fill="#cbd5e1" font-size="10.5">Mettler Toledo XPR/ICS Balances, Sartorius Cubis II, OsmoTECH</text>
  <text x="778" y="289" fill="#cbd5e1" font-size="10.5">&amp; Fiske 210 Osmometers, SevenExcellence pH, Kryo 560 Freezers</text>

  <!-- CARD 4: RS-485 2-Wire Screw Terminal -->
  <rect x="28" y="328" width="332" height="224" rx="10" fill="url(#card)" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="52" cy="352" r="13" fill="#a855f7"/>
  <text x="52" y="357" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">4</text>
  <text x="74" y="352" fill="#e2e8f0" font-size="14" font-weight="700">RS-485 2-Wire Terminal Block</text>
  <text x="74" y="369" fill="#c084fc" font-size="11" font-weight="600">Modbus RTU Multi-Drop • BACnet MS/TP Daisy Chain</text>

  <!-- Green Phoenix Terminal Block Graphic -->
  <rect x="48" y="384" width="102" height="82" rx="5" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <circle cx="68" cy="410" r="9" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="62" y1="410" x2="74" y2="410" stroke="#0f172a" stroke-width="2"/>
  <text x="68" y="435" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="700">D+ (A)</text>

  <circle cx="99" cy="410" r="9" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="93" y1="410" x2="105" y2="410" stroke="#0f172a" stroke-width="2"/>
  <text x="99" y="435" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="700">D- (B)</text>

  <circle cx="130" cy="410" r="9" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="124" y1="410" x2="136" y2="410" stroke="#0f172a" stroke-width="2"/>
  <text x="130" y="435" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="700">GND</text>
  <text x="99" y="456" text-anchor="middle" fill="#facc15" font-size="9.5" font-weight="600">+ 120 Ω End Resistor</text>

  <text x="162" y="396" fill="#cbd5e1" font-size="11" font-weight="600">What You Need:</text>
  <text x="162" y="413" fill="#94a3b8" font-size="10.5">• Belden 9841 / 3106A Shielded</text>
  <text x="162" y="428" fill="#94a3b8" font-size="10.5">  Twisted Pair (120 Ω impedance).</text>
  <text x="162" y="445" fill="#94a3b8" font-size="10.5">• Connect to Moxa NPort 5150</text>
  <text x="162" y="460" fill="#94a3b8" font-size="10.5">  (Modbus RTU) or BASrouter</text>
  <text x="162" y="475" fill="#94a3b8" font-size="10.5">  (BACnet MS/TP → BACnet/IP).</text>
  <rect x="46" y="482" width="296" height="56" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="56" y="499" fill="#c084fc" font-size="11" font-weight="600">Found On:</text>
  <text x="56" y="515" fill="#cbd5e1" font-size="10.5">Cleanroom Room DP sensors, Hamilton Arc RS-485 probes,</text>
  <text x="56" y="530" fill="#cbd5e1" font-size="10.5">Brooks Mass Flow Controllers, PHCbi/Thermo -80°C ULT Freezers</text>

  <!-- CARD 5: End-to-End Physical Adapter & Network Bridge Pipeline -->
  <rect x="380" y="328" width="712" height="224" rx="10" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="404" y="356" fill="#f8fafc" font-size="15" font-weight="700">How Physical Ports Connect to GxPHistorian (Universal Wiring Cheat Sheet)</text>
  <text x="404" y="375" fill="#94a3b8" font-size="12">Every instrument—whether modern Ethernet or 20-year-old serial—converges into GxPHistorian Pillar 1 (edge-collector)</text>

  <!-- Path A: Ethernet Direct -->
  <rect x="404" y="394" width="175" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="491" y="412" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Ports 1 &amp; 2: Ethernet</text>
  <text x="491" y="427" text-anchor="middle" fill="#38bdf8" font-size="10">RJ45 / M12 Cat6A Cable</text>

  <line x1="579" y1="415" x2="635" y2="415" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <rect x="641" y="394" width="190" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="736" y="412" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Cleanroom VLAN Switch</text>
  <text x="736" y="427" text-anchor="middle" fill="#94a3b8" font-size="10">TCP :4840 / :502 / UDP :47808</text>

  <line x1="831" y1="415" x2="883" y2="445" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Path B: Serial / RS-485 via Moxa -->
  <rect x="404" y="448" width="175" height="42" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="491" y="466" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Ports 3 &amp; 4: DB9 / RS-485</text>
  <text x="491" y="481" text-anchor="middle" fill="#facc15" font-size="10">Serial / Twisted-Pair Cable</text>

  <line x1="579" y1="469" x2="635" y2="469" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <rect x="641" y="448" width="190" height="42" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
  <text x="736" y="466" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Moxa NPort / Router Box</text>
  <text x="736" y="481" text-anchor="middle" fill="#facc15" font-size="10">Converts Serial → Ethernet IP</text>

  <line x1="831" y1="469" x2="883" y2="469" stroke="#facc15" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Path C: Windows OPC DA / File Drop -->
  <rect x="404" y="502" width="175" height="38" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="491" y="518" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Legacy Windows / CSV PC</text>
  <text x="491" y="532" text-anchor="middle" fill="#34d399" font-size="10">UNICORN / Cedex / Sartocheck</text>

  <line x1="579" y1="521" x2="635" y2="521" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="641" y="502" width="190" height="38" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="736" y="518" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Python Forwarder / Watcher</text>
  <text x="736" y="532" text-anchor="middle" fill="#34d399" font-size="10">HTTP POST JSON → :8080/ingest</text>

  <line x1="831" y1="521" x2="883" y2="493" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Destination: GxPHistorian -->
  <rect x="889" y="394" width="184" height="146" rx="8" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>
  <text x="981" y="420" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">GxPHistorian</text>
  <text x="981" y="438" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">edge-collector</text>
  <text x="981" y="456" text-anchor="middle" fill="#94a3b8" font-size="10">• Disk WAL Buffer (1M pts)</text>
  <text x="981" y="472" text-anchor="middle" fill="#94a3b8" font-size="10">• ExcDev Deadband Filter</text>
  <line x1="905" y1="482" x2="1057" y2="482" stroke="#334155"/>
  <text x="981" y="499" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="600">ClickHouse 24.8 Archive</text>
  <text x="981" y="515" text-anchor="middle" fill="#facc15" font-size="10.5" font-weight="600">PostgreSQL 16 Part 11</text>
  <text x="981" y="531" text-anchor="middle" fill="#e2e8f0" font-size="10">Grafana HMI &amp; Excel UDFs</text>
</svg>
