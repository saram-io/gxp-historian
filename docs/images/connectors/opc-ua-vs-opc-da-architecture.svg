<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg-opc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-opc-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-opc-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-opc-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1100" height="650" rx="16" fill="url(#bg-opc)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="35" y="40" fill="#f8fafc" font-size="21" font-weight="800" letter-spacing="0.3">HOW OPC UA (`TCP :4840`) &amp; CLASSIC OPC DA (`COM/DCOM`) WORK UNDER THE HOOD</text>
  <text x="35" y="62" fill="#94a3b8" font-size="13">Address Space NodeId Tree • MonitoredItem Subscription Loop • X.509 Certificate Mutual Trust • Zero-DCOM Localhost Bridge</text>

  <!-- TOP PANEL: OPC UA ARCHITECTURE (IEC 62541) -->
  <g transform="translate(30, 82)">
    <rect width="1040" height="300" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="1040" height="34" rx="12" fill="#0c4a6e"/>
    <text x="520" y="22" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">1. MODERN OPC UA (`opc.tcp://&lt;IP&gt;:4840`) — SINGLE FIREWALL PORT, CROSS-PLATFORM &amp; ENCRYPTED</text>

    <!-- Box A: OPC UA Address Space & NodeId -->
    <g transform="translate(18, 46)">
      <rect width="310" height="238" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="155" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">A. OPC UA ADDRESS SPACE TREE</text>

      <!-- Tree visual -->
      <text x="18" y="42" fill="#f8fafc" font-size="10" font-weight="700">📁 Root (i=84)</text>
      <text x="30" y="59" fill="#e2e8f0" font-size="10">└── 📁 Objects (i=85)</text>
      <text x="50" y="76" fill="#7dd3fc" font-size="10" font-weight="700">└── 📁 Bioreactor_201 (ns=2;s="BR201")</text>
      <text x="72" y="94" fill="#34d399" font-size="9.5">├── 🏷️ Temp_PV (ns=2;s="BR201.Temp_PV")</text>
      <text x="90" y="109" fill="#94a3b8" font-size="8.5">Value: 37.02 | Type: Double | Access: Read</text>
      <text x="72" y="126" fill="#34d399" font-size="9.5">├── 🏷️ pH_PV (ns=2;s="BR201.pH_PV")</text>
      <text x="72" y="143" fill="#fbbf24" font-size="9.5">└── 🏷️ Phase_State (ns=2;i=10422)</text>

      <rect x="14" y="156" width="282" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="24" y="172" fill="#7dd3fc" font-size="9.5" font-weight="700">Anatomy of an OPC UA `NodeId`:</text>
      <text x="24" y="187" fill="#cbd5e1" font-size="9">• `ns=2`: Namespace Index (Vendor PLC table)</text>
      <text x="24" y="201" fill="#cbd5e1" font-size="9">• `s=...`: String ID (e.g. `s="DB_HMI.Temp_PV"`)</text>
      <text x="24" y="215" fill="#cbd5e1" font-size="9">• `i=...`: Numeric Integer ID (`i=10422`)</text>
    </g>

    <!-- Box B: Subscription & MonitoredItem Engine + X.509 Handshake -->
    <g transform="translate(346, 46)">
      <rect width="358" height="238" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="179" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">B. SESSION, X.509 TRUST &amp; SUBSCRIPTION LOOP</text>

      <!-- Sequence steps -->
      <rect x="16" y="32" width="326" height="44" rx="5" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="26" y="48" fill="#e0f2fe" font-size="9.5" font-weight="700">Step 1: SecureChannel (`Basic256Sha256`)</text>
      <text x="26" y="63" fill="#94a3b8" font-size="8.5">Mutual X.509 `.pem` certificate check + User/Pass token</text>

      <rect x="16" y="84" width="326" height="44" rx="5" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
      <text x="26" y="100" fill="#e0f2fe" font-size="9.5" font-weight="700">Step 2: CreateSubscription + MonitoredItems</text>
      <text x="26" y="115" fill="#94a3b8" font-size="8.5">`SamplingInterval = 500ms`, `AbsoluteDeadband = 0.05`</text>

      <rect x="16" y="136" width="326" height="44" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="26" y="152" fill="#d1fae5" font-size="9.5" font-weight="700">Step 3: Publish / DataChangeNotification</text>
      <text x="26" y="167" fill="#a7f3d0" font-size="8.5">Server pushes `(Value, SourceTimestamp, StatusCode)`</text>

      <rect x="16" y="188" width="326" height="38" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="179" y="205" text-anchor="middle" fill="#38bdf8" font-size="9.5" font-weight="700">Firewall Rule: Open ONLY 1 Port (`TCP 4840`)!</text>
      <text x="179" y="219" text-anchor="middle" fill="#94a3b8" font-size="8.5">Works natively from Linux Docker (`edge-collector`)</text>
    </g>

    <!-- Box C: 32-Bit OPC UA StatusCode Mapping -->
    <g transform="translate(722, 46)">
      <rect width="300" height="238" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="150" y="20" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700">C. 32-BIT STATUSCODE → GXP QUALITY</text>

      <!-- Good -->
      <rect x="14" y="34" width="272" height="54" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="24" y="52" fill="#34d399" font-size="10" font-weight="700">Bits 31..30 = `00` (`0x00000000` Good)</text>
      <text x="24" y="67" fill="#d1fae5" font-size="9">→ GxPHistorian `quality = 192` (Good)</text>
      <text x="24" y="80" fill="#a7f3d0" font-size="8">Included in all GMP rollups, LTTB &amp; Batch KPIs</text>

      <!-- Uncertain -->
      <rect x="14" y="98" width="272" height="54" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="24" y="116" fill="#fbbf24" font-size="10" font-weight="700">Bits 31..30 = `01` (`0x40000000` Uncertain)</text>
      <text x="24" y="131" fill="#fef3c7" font-size="9">→ GxPHistorian `quality = 64` (Uncertain)</text>
      <text x="24" y="144" fill="#fde68a" font-size="8">SubNormal / LastUsableValue / Calibration active</text>

      <!-- Bad -->
      <rect x="14" y="162" width="272" height="62" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="24" y="180" fill="#fca5a5" font-size="10" font-weight="700">Bits 31..30 = `10` (`0x80000000` Bad)</text>
      <text x="24" y="195" fill="#fee2e2" font-size="9">→ GxPHistorian `quality = 0` (Bad)</text>
      <text x="24" y="209" fill="#fecaca" font-size="8">SensorFailure / CommFailure (Excluded from rollups!)</text>
    </g>
  </g>

  <!-- BOTTOM PANEL: CLASSIC OPC DA 2.05a (WHY NETWORK DCOM FAILS VS LOCALHOST BRIDGE) -->
  <g transform="translate(30, 402)">
    <rect width="1040" height="222" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="1040" height="34" rx="12" fill="#064e3b"/>
    <text x="520" y="22" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">2. CLASSIC WINDOWS OPC DA 2.05a / 3.0 — WHY NETWORK DCOM FAILS &amp; HOW OUR LOCALHOST BRIDGE WORKS</text>

    <!-- Left Half: Legacy Network DCOM Nightmare (Crossed out) -->
    <g transform="translate(18, 46)">
      <rect width="460" height="162" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="230" y="20" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">❌ ANTI-PATTERN: REMOTE NETWORK DCOM</text>

      <rect x="16" y="34" width="145" height="65" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="88" y="54" text-anchor="middle" fill="#f8fafc" font-size="9.5" font-weight="700">Windows Skid PC</text>
      <text x="88" y="69" text-anchor="middle" fill="#94a3b8" font-size="8.5">`UNICORN.OPCServer.1`</text>
      <text x="88" y="83" text-anchor="middle" fill="#94a3b8" font-size="8">CLSID Registry</text>

      <path d="M 161 52 L 295 52" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-opc-red)"/>
      <path d="M 161 78 L 295 78" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-opc-red)"/>
      <text x="228" y="45" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">TCP 135 (RPC Mapper)</text>
      <text x="228" y="71" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">Ports 49152–65535!</text>

      <rect x="300" y="34" width="144" height="65" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="372" y="56" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="700">Blocked by Firewall</text>
      <text x="372" y="72" text-anchor="middle" fill="#94a3b8" font-size="8">`0x800706BA`</text>
      <text x="372" y="85" text-anchor="middle" fill="#94a3b8" font-size="8">RPC Server Unavail</text>

      <text x="16" y="120" fill="#cbd5e1" font-size="9">• Requires opening 16,000+ high ports across cleanroom VLANs</text>
      <text x="16" y="136" fill="#cbd5e1" font-size="9">• Breaks whenever Windows Update patches DCOM hardening (KB5004442)</text>
      <text x="16" y="152" fill="#fca5a5" font-size="9" font-weight="700">• Fails Linux compatibility (DCOM is proprietary to Windows)</text>
    </g>

    <!-- Right Half: GxPHistorian Zero-DCOM Localhost Bridge -->
    <g transform="translate(498, 46)">
      <rect width="524" height="162" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="262" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">✅ GXPHISTORIAN PATTERN: LOCALHOST COM + OUTBOUND HTTP WAL</text>

      <!-- Windows PC Box -->
      <rect x="14" y="30" width="335" height="76" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="181" y="44" text-anchor="middle" fill="#a7f3d0" font-size="8.5" font-weight="700">INSIDE THE WINDOWS SKID PC (`127.0.0.1` LOOPBACK)</text>

      <rect x="24" y="52" width="128" height="44" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <text x="88" y="70" text-anchor="middle" fill="#f8fafc" font-size="8.5" font-weight="700">OPC DA 2.05a Server</text>
      <text x="88" y="84" text-anchor="middle" fill="#94a3b8" font-size="7.5">`IOPCServer::GetStatus`</text>

      <path d="M 152 74 L 188 74" stroke="#10b981" stroke-width="2" marker-end="url(#arr-opc-emerald)"/>
      <text x="170" y="67" text-anchor="middle" fill="#34d399" font-size="7" font-weight="700">Local COM</text>

      <rect x="192" y="52" width="146" height="44" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="265" y="68" text-anchor="middle" fill="#d1fae5" font-size="8.5" font-weight="700">opcda_windows_forwarder</text>
      <text x="265" y="82" text-anchor="middle" fill="#34d399" font-size="7.5">ExcDev + `opcda_spool.jsonl`</text>

      <path d="M 349 68 L 398 68" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-opc-cyan)"/>
      <text x="373" y="59" text-anchor="middle" fill="#7dd3fc" font-size="7.5" font-weight="700">POST :8080</text>

      <rect x="402" y="34" width="108" height="72" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="456" y="56" text-anchor="middle" fill="#e0f2fe" font-size="9" font-weight="700">edge-collector</text>
      <text x="456" y="71" text-anchor="middle" fill="#38bdf8" font-size="8">`:8080/ingest`</text>
      <text x="456" y="85" text-anchor="middle" fill="#94a3b8" font-size="7.5">ClickHouse WAL</text>

      <text x="16" y="123" fill="#cbd5e1" font-size="9">• Zero inbound firewall ports opened on the Windows workstation!</text>
      <text x="16" y="138" fill="#cbd5e1" font-size="9">• Maps COM `OPC_QUALITY_GOOD (0xC0)` → `192`, `UNCERTAIN (0x40)` → `64`, `BAD (0x00)` → `0`</text>
      <text x="16" y="153" fill="#34d399" font-size="9" font-weight="700">• Buffers locally to disk (`LocalSpoolBuffer`) if the plant network is disconnected</text>
    </g>
  </g>
</svg>
