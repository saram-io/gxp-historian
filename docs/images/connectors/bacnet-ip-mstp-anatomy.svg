<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg-bac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arr-b-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-b-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1100" height="650" rx="16" fill="url(#bg-bac)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="35" y="40" fill="#f8fafc" font-size="21" font-weight="800" letter-spacing="0.3">HOW BACNET/IP (`UDP :47808`) &amp; BACNET MS/TP (`RS-485`) WORK UNDER THE HOOD</text>
  <text x="35" y="62" fill="#94a3b8" font-size="13">Physical Terminal &amp; DIP Switch Layout • MS/TP-to-IP Router &amp; BBMD • ASHRAE 135 Objects • `SubscribeCOV` • 4-Bit `Status_Flags` Mapping</text>

  <!-- TOP HALF: PHYSICAL HARDWARE, DIP SWITCHES & MS/TP ROUTER TOPOLOGY -->
  <g transform="translate(30, 82)">
    <rect width="1040" height="260" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="1040" height="34" rx="12" fill="#064e3b"/>
    <text x="520" y="22" text-anchor="middle" fill="#d1fae5" font-size="13" font-weight="700">1. PHYSICAL HARDWARE APPEARANCE: CLEANROOM ΔP SENSOR → MS/TP RS-485 → BACNET ROUTER / BBMD</text>

    <!-- Box 1: Cleanroom DP Controller & Physical Terminal/DIP Switches -->
    <g transform="translate(20, 48)">
      <rect width="340" height="196" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="170" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">A. FIELD CONTROLLER (BACNET MS/TP)</text>

      <!-- Terminal Block + DIP Switches Illustration -->
      <rect x="16" y="32" width="142" height="86" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <text x="87" y="48" text-anchor="middle" fill="#d1fae5" font-size="9" font-weight="700">3-PIN MS/TP PLUG</text>
      <circle cx="42" cy="70" r="8" fill="#cbd5e1"/><text x="42" y="92" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="700">MS/TP+</text>
      <circle cx="87" cy="70" r="8" fill="#cbd5e1"/><text x="87" y="92" text-anchor="middle" fill="#38bdf8" font-size="8" font-weight="700">MS/TP-</text>
      <circle cx="132" cy="70" r="8" fill="#cbd5e1"/><text x="132" y="92" text-anchor="middle" fill="#a7f3d0" font-size="8" font-weight="700">COM/S</text>
      <text x="87" y="108" text-anchor="middle" fill="#fca5a5" font-size="8" font-weight="700">EOL Jumper = ON (120Ω)</text>

      <!-- 8-Position MAC Address DIP Switch Bank -->
      <rect x="172" y="32" width="152" height="86" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="248" y="48" text-anchor="middle" fill="#fde68a" font-size="9" font-weight="700">MAC DIP SWITCH (1..127)</text>
      <!-- 8 tiny switches -->
      <rect x="184" y="56" width="12" height="26" fill="#0f172a"/><rect x="186" y="58" width="8" height="10" fill="#ef4444"/>
      <rect x="200" y="56" width="12" height="26" fill="#0f172a"/><rect x="202" y="70" width="8" height="10" fill="#cbd5e1"/>
      <rect x="216" y="56" width="12" height="26" fill="#0f172a"/><rect x="218" y="58" width="8" height="10" fill="#ef4444"/>
      <rect x="232" y="56" width="12" height="26" fill="#0f172a"/><rect x="234" y="58" width="8" height="10" fill="#ef4444"/>
      <rect x="248" y="56" width="12" height="26" fill="#0f172a"/><rect x="250" y="70" width="8" height="10" fill="#cbd5e1"/>
      <rect x="264" y="56" width="12" height="26" fill="#0f172a"/><rect x="266" y="70" width="8" height="10" fill="#cbd5e1"/>
      <rect x="280" y="56" width="12" height="26" fill="#0f172a"/><rect x="282" y="70" width="8" height="10" fill="#cbd5e1"/>
      <rect x="296" y="56" width="12" height="26" fill="#0f172a"/><rect x="298" y="70" width="8" height="10" fill="#cbd5e1"/>
      <text x="248" y="96" text-anchor="middle" fill="#fbbf24" font-size="8.5" font-weight="700">Binary `1+4+8` = MAC `13`</text>
      <text x="248" y="109" text-anchor="middle" fill="#94a3b8" font-size="8">Baud: `38400` or `76800`</text>

      <text x="16" y="138" fill="#cbd5e1" font-size="9.5">• Master-Slave / Token-Passing ring (`MAC 0..127`)</text>
      <text x="16" y="154" fill="#cbd5e1" font-size="9.5">• Every controller on the trunk has a unique MAC</text>
      <text x="16" y="170" fill="#cbd5e1" font-size="9.5">• Global `Device Instance ID` (e.g., `204101`)</text>
      <text x="16" y="186" fill="#34d399" font-size="9.5" font-weight="700">• Routed address = `DNET:DADR` (`2001:13`)</text>
    </g>

    <path d="M 360 146 L 408 146" stroke="#10b981" stroke-width="3" marker-end="url(#arr-b-green)"/>
    <text x="384" y="136" text-anchor="middle" fill="#34d399" font-size="8" font-weight="700">RS-485</text>

    <!-- Box 2: BACnet MS/TP to BACnet/IP Router + BBMD -->
    <g transform="translate(412, 48)">
      <rect width="295" height="196" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="147" y="20" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">B. BACNET ROUTER &amp; BBMD (`UDP :47808`)</text>

      <rect x="18" y="32" width="258" height="72" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
      <text x="147" y="50" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">LOYTEC / Contemporary Controls BASrouter</text>
      <text x="147" y="66" text-anchor="middle" fill="#e0f2fe" font-size="9">IP: `10.20.85.1:47808` (`0xBAC0`)</text>
      <text x="147" y="82" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="700">Routes Ethernet UDP ↔ MS/TP Network `2001`</text>
      <text x="147" y="96" text-anchor="middle" fill="#94a3b8" font-size="8">Acts as BBMD for Cross-Subnet Discovery</text>

      <text x="16" y="124" fill="#7dd3fc" font-size="9.5" font-weight="700">Why BBMD Foreign Device Registration Matters:</text>
      <text x="16" y="140" fill="#cbd5e1" font-size="9">• BACnet `Who-Is` uses UDP Broadcasts, which</text>
      <text x="16" y="154" fill="#cbd5e1" font-size="9">  routers block between VLANs.</text>
      <text x="16" y="169" fill="#cbd5e1" font-size="9">• `bacnet_cov_worker.py` registers with the BBMD</text>
      <text x="16" y="184" fill="#38bdf8" font-size="9" font-weight="700">  via Unicast UDP `:47808` across any firewall!</text>
    </g>

    <path d="M 707 146 L 755 146" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-b-cyan)"/>
    <text x="731" y="136" text-anchor="middle" fill="#7dd3fc" font-size="8" font-weight="700">UDP 47808</text>

    <!-- Box 3: GxPHistorian Async BACnet Worker -->
    <g transform="translate(760, 48)">
      <rect width="260" height="196" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="130" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">C. GXPHISTORIAN BACNET WORKER</text>

      <rect x="16" y="32" width="228" height="62" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="130" y="50" text-anchor="middle" fill="#d1fae5" font-size="9.5" font-weight="700">`bacnet_cov_worker.py`</text>
      <text x="130" y="66" text-anchor="middle" fill="#34d399" font-size="8.5">1. `SubscribeCOV` (Push on Change)</text>
      <text x="130" y="80" text-anchor="middle" fill="#34d399" font-size="8.5">2. `ReadPropertyMultiple` Fallback</text>

      <text x="16" y="114" fill="#cbd5e1" font-size="9">• Reads `presentValue` + `statusFlags`</text>
      <text x="16" y="130" fill="#cbd5e1" font-size="9">  atomically in a single UDP packet</text>
      <text x="16" y="146" fill="#cbd5e1" font-size="9">• Applies Stage 1 `ExcDev` / `ExcMax`</text>
      <text x="16" y="162" fill="#cbd5e1" font-size="9">• Forwards to `:8080/ingest` WAL</text>
      <text x="16" y="182" fill="#10b981" font-size="9" font-weight="700">• Triggers Cleanroom ΔP Event Frames</text>
    </g>
  </g>

  <!-- BOTTOM HALF: ASHRAE 135 OBJECT MODEL & 4-BIT STATUS_FLAGS TO OPC QUALITY MAPPING -->
  <g transform="translate(30, 362)">
    <rect width="1040" height="260" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="1040" height="34" rx="12" fill="#0c4a6e"/>
    <text x="520" y="22" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="700">2. INSIDE A BACNET OBJECT &amp; HOW ASHRAE 4-BIT `Status_Flags` MAP TO GXP OPC QUALITY</text>

    <!-- Left: BACnet Standard Object Types & Properties -->
    <g transform="translate(20, 48)">
      <rect width="485" height="196" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="242" y="20" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">ASHRAE 135 OBJECT TYPES &amp; STANDARD PROPERTIES</text>

      <text x="16" y="42" fill="#38bdf8" font-size="10" font-weight="700">Common Cleanroom / BMS Object Identifiers:</text>
      <text x="22" y="59" fill="#cbd5e1" font-size="9.5">• `analog-input,1` (`AI:1`): Physical Sensor (Room ΔP `18.5 Pa`, Temp `19.4 °C`)</text>
      <text x="22" y="75" fill="#cbd5e1" font-size="9.5">• `analog-output,1` (`AO:1`): Modulating Actuator (HEPA Damper `68.2 %`)</text>
      <text x="22" y="91" fill="#cbd5e1" font-size="9.5">• `analog-value,1` (`AV:1`): Software Setpoint (`Room_DP_Low_Limit = 12.5 Pa`)</text>
      <text x="22" y="107" fill="#cbd5e1" font-size="9.5">• `binary-input,1` (`BI:1`): Door Interlock Switch (`0 = Closed`, `1 = Open`)</text>

      <rect x="16" y="120" width="453" height="64" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="26" y="137" fill="#7dd3fc" font-size="9.5" font-weight="700">Properties Polled on Every `analog-input` Object:</text>
      <text x="26" y="153" fill="#cbd5e1" font-size="9">• `Property 85 (present-value)`: IEEE-754 Float (`+18.5`)</text>
      <text x="26" y="168" fill="#cbd5e1" font-size="9">• `Property 111 (status-flags)`: 4-Bit Array `[IN_ALARM, FAULT, OVERRIDDEN, OUT_OF_SERVICE]`</text>
    </g>

    <!-- Right: 4-Bit Status_Flags Truth Table -->
    <g transform="translate(525, 48)">
      <rect width="495" height="196" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <text x="247" y="20" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">4-BIT `Status_Flags` → GXPHISTORIAN QUALITY TRUTH TABLE</text>

      <!-- Row 1: Normal -->
      <rect x="16" y="32" width="463" height="35" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="26" y="53" fill="#d1fae5" font-size="9.5" font-weight="700">`[0, 0, 0, 0]` (All False — Normal Operation)</text>
      <text x="315" y="53" fill="#34d399" font-size="9.5" font-weight="800">→ `quality = 192` (Good)</text>

      <!-- Row 2: In Alarm -->
      <rect x="16" y="73" width="463" height="35" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
      <text x="26" y="94" fill="#d1fae5" font-size="9.5" font-weight="700">`[1, 0, 0, 0]` (`IN_ALARM = 1` — Real Excursion!)</text>
      <text x="315" y="94" fill="#34d399" font-size="9.5" font-weight="800">→ `quality = 192` (`status=4`)</text>

      <!-- Row 3: Overridden / Out of Service -->
      <rect x="16" y="114" width="463" height="35" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="26" y="135" fill="#fef3c7" font-size="9.5" font-weight="700">`[0, 0, 1, 0]` or `[0, 0, 0, 1]` (`OVERRIDDEN / OOS`)</text>
      <text x="315" y="135" fill="#fbbf24" font-size="9.5" font-weight="800">→ `quality = 64` (Uncertain)</text>

      <!-- Row 4: Fault -->
      <rect x="16" y="155" width="463" height="32" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
      <text x="26" y="175" fill="#fee2e2" font-size="9.5" font-weight="700">`[x, 1, x, x]` (`FAULT = 1` — Cut Wire / Broken Sensor)</text>
      <text x="315" y="175" fill="#fca5a5" font-size="9.5" font-weight="800">→ `quality = 0` (Bad)</text>
    </g>
  </g>
</svg>
