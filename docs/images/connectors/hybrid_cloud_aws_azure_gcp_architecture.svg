<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" width="100%" height="auto" font-family="'Roboto Mono', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="740" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Header Banner -->
  <rect x="18" y="16" width="1084" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="34" y="42" fill="#f8fafc" font-size="17.5" font-weight="700">GxPHistorian Hybrid OT + Cloud Deployment Architecture (AWS · Azure · GCP)</text>
  <text x="34" y="63" fill="#94a3b8" font-size="11.2">Purdue Level 1–2.5 On-Premises Store-and-Forward Edge  |  3 Selectable Topologies  |  21 CFR Part 11 WORM &amp; Lakehouse</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 1: ON-PREMISES cGMP PLANT (PURDUE LEVELS 1 - 2.5 / 3)          -->
  <!-- ===================================================================== -->
  <rect x="18" y="88" width="332" height="634" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <rect x="18" y="88" width="332" height="34" rx="10" fill="#064e3b"/>
  <text x="184" y="110" text-anchor="middle" fill="#ecfdf5" font-size="12.5" font-weight="700">ON-PREMISES cGMP PLANT (PURDUE L1–L3)</text>

  <!-- Level 1/2 Cleanroom Skids -->
  <rect x="30" y="134" width="308" height="148" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="155" fill="#34d399" font-size="11" font-weight="700">Purdue Level 1/2: Cleanroom Skids</text>
  <text x="42" y="175" fill="#e2e8f0" font-size="9.5">• Bioreactors/Chrom: OPC UA (:4840) &amp; S7</text>
  <text x="42" y="194" fill="#e2e8f0" font-size="9.5">• UNICORN 7 &amp; DeltaV: OPC DA Sidecar</text>
  <text x="42" y="213" fill="#e2e8f0" font-size="9.5">• Cleanroom EMS: BACnet (:47808) &amp; Modbus</text>
  <text x="42" y="232" fill="#e2e8f0" font-size="9.5">• Balances &amp; QC: RS-232 (:4001) &amp; PI UFL</text>
  <rect x="42" y="246" width="284" height="24" rx="4" fill="#065f46"/>
  <text x="184" y="262" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">Air-Gapped OT VLAN (No Direct Internet)</text>

  <!-- Arrow L1/2 to L2.5 -->
  <line x1="184" y1="282" x2="184" y2="310" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Level 2.5 Industrial DMZ Edge Collector -->
  <rect x="30" y="312" width="308" height="192" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="42" y="333" fill="#6ee7b7" font-size="11" font-weight="700">Purdue Level 2.5: Pillar 1 (Edge)</text>
  <text x="42" y="351" fill="#cbd5e1" font-size="9.5">DIN-Rail IPC / DMZ VM / Outposts / Local</text>
  <rect x="42" y="361" width="284" height="58" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="52" y="380" fill="#38bdf8" font-size="10" font-weight="700">1. Stage 1 ExcDev + Stage 2 SDT</text>
  <text x="52" y="397" fill="#94a3b8" font-size="9.3">65–80% noise filter; quality &gt;= 192</text>
  <text x="52" y="412" fill="#94a3b8" font-size="9.3">Tuple: (tag_id, ts, val, quality)</text>

  <rect x="42" y="427" width="284" height="66" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="52" y="446" fill="#fbbf24" font-size="10" font-weight="700">2. 100 GB Telegraf Disk WAL (URS-005)</text>
  <text x="52" y="464" fill="#e2e8f0" font-size="9.3">/var/lib/telegraf/buffer (pSLC NVMe)</text>
  <text x="52" y="481" fill="#fde68a" font-size="9.3" font-weight="700">&gt;14 Days Offline WAN Autonomy</text>

  <!-- Arrow L2.5 to Optional On-Prem L3 Core -->
  <line x1="184" y1="504" x2="184" y2="532" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- Optional On-Prem Level 3 Core (Patterns A & C) -->
  <rect x="30" y="534" width="308" height="172" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="42" y="555" fill="#38bdf8" font-size="11" font-weight="700">Purdue Level 3: Plant Core (A &amp; C)</text>
  <text x="42" y="574" fill="#e2e8f0" font-size="9.5">• clickhouse-archive (10-Yr Local NVMe)</text>
  <text x="42" y="592" fill="#e2e8f0" font-size="9.5">• postgres-control (ltree + WORM Log)</text>
  <text x="42" y="610" fill="#e2e8f0" font-size="9.5">• historian-api + MCP (:8020 / :8030)</text>
  <text x="42" y="628" fill="#e2e8f0" font-size="9.5">• grafana-vision (:3020) &amp; DataLink</text>
  <rect x="42" y="642" width="284" height="50" rx="5" fill="#0f172a" stroke="#334155"/>
  <text x="184" y="662" text-anchor="middle" fill="#7dd3fc" font-size="9.5" font-weight="700">100% Autonomous Local Batch &amp; E-Sign</text>
  <text x="184" y="680" text-anchor="middle" fill="#94a3b8" font-size="9.2">Optional in Pattern B (Thin Edge)</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 2: HYBRID TOPOLOGY SELECTOR & PRIVATE WAN BOUNDARY             -->
  <!-- ===================================================================== -->
  <rect x="372" y="88" width="262" height="634" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <rect x="372" y="88" width="262" height="34" rx="10" fill="#1e293b"/>
  <text x="503" y="110" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">3 HYBRID DEPLOYMENT PATTERNS</text>

  <!-- Pattern B Box -->
  <rect x="384" y="136" width="238" height="152" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="396" y="157" fill="#34d399" font-size="10.8" font-weight="700">Pattern B: Thin Edge + Cloud</text>
  <text x="396" y="176" fill="#e2e8f0" font-size="9.5">• On-Prem: Pillar 1 (Edge WAL)</text>
  <text x="396" y="194" fill="#e2e8f0" font-size="9.5">• Cloud: Pillars 2, 3 &amp; 4 in VPC</text>
  <text x="396" y="213" fill="#94a3b8" font-size="9.3">Outbound HTTPS/mTLS (:8443)</text>
  <text x="396" y="229" fill="#94a3b8" font-size="9.3">CH_INGEST_URL -&gt; Cloud ClickHouse</text>
  <text x="396" y="245" fill="#94a3b8" font-size="9.3">PG_SSLMODE=verify-full -&gt; Cloud PG</text>
  <rect x="396" y="256" width="214" height="22" rx="4" fill="#064e3b"/>
  <text x="503" y="271" text-anchor="middle" fill="#a7f3d0" font-size="9.5" font-weight="700">Zero On-Prem Database Servers</text>

  <!-- Pattern C Box -->
  <rect x="384" y="304" width="238" height="156" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="396" y="325" fill="#fbbf24" font-size="10.8" font-weight="700">Pattern C: Multi-Site Hub</text>
  <text x="396" y="344" fill="#e2e8f0" font-size="9.5">• On-Prem: Pillars 1–4 per site</text>
  <text x="396" y="362" fill="#e2e8f0" font-size="9.5">• Cloud: Global Enterprise Hub</text>
  <text x="396" y="381" fill="#94a3b8" font-size="9.3">Telegraf Dual [[outputs.http]]:</text>
  <text x="396" y="397" fill="#94a3b8" font-size="9.3">1) Local ClickHouse (:8123)</text>
  <text x="396" y="413" fill="#94a3b8" font-size="9.3">2) Cloud Hub (:8443 mTLS)</text>
  <rect x="396" y="426" width="214" height="22" rx="4" fill="#78350f"/>
  <text x="503" y="441" text-anchor="middle" fill="#fde68a" font-size="9.5" font-weight="700">Cross-Site Golden Batch &amp; AI</text>

  <!-- Pattern A Box -->
  <rect x="384" y="476" width="238" height="156" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="396" y="497" fill="#38bdf8" font-size="10.8" font-weight="700">Pattern A: Thick Plant + WORM</text>
  <text x="396" y="516" fill="#e2e8f0" font-size="9.5">• On-Prem: Full Pillars 1–4 in L3</text>
  <text x="396" y="534" fill="#e2e8f0" font-size="9.5">• Cloud: 15-Yr WORM + Lakehouse</text>
  <text x="396" y="553" fill="#94a3b8" font-size="9.3">ClickHouse TTL Volume 'cold_worm'</text>
  <text x="396" y="569" fill="#94a3b8" font-size="9.3">pgBackRest Encrypted PITR WAL</text>
  <text x="396" y="585" fill="#94a3b8" font-size="9.3">/api/v1/lakehouse/export-parquet</text>
  <rect x="396" y="598" width="214" height="22" rx="4" fill="#0c4a6e"/>
  <text x="503" y="613" text-anchor="middle" fill="#bae6fd" font-size="9.5" font-weight="700">21 CFR 211.180 15-Yr WORM Tier</text>

  <!-- Private WAN Footer -->
  <rect x="384" y="646" width="238" height="60" rx="6" fill="#090d16" stroke="#64748b"/>
  <text x="503" y="668" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="700">21 CFR §11.30 Open System Transit</text>
  <text x="503" y="688" text-anchor="middle" fill="#94a3b8" font-size="9.2">Direct Connect · ExpressRoute · VPN</text>

  <!-- Connecting Arrows Between Columns -->
  <line x1="338" y1="375" x2="384" y2="212" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="338" y1="405" x2="384" y2="382" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="338" y1="600" x2="384" y2="554" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===================================================================== -->
  <!-- COLUMN 3: AWS, MICROSOFT AZURE & GOOGLE CLOUD (GCP) TARGET STACKS     -->
  <!-- ===================================================================== -->
  <rect x="656" y="88" width="446" height="634" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="656" y="88" width="446" height="34" rx="10" fill="#0c4a6e"/>
  <text x="879" y="110" text-anchor="middle" fill="#f0f9ff" font-size="12.5" font-weight="700">CLOUD VPC / VNET STACKS (AWS · AZURE · GCP)</text>

  <!-- 1. AWS Card -->
  <rect x="670" y="136" width="418" height="182" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="670" y="136" width="418" height="30" rx="8" fill="#78350f"/>
  <text x="684" y="156" fill="#fef3c7" font-size="11.5" font-weight="700">1. Amazon Web Services (AWS) — PrivateLink</text>
  <text x="684" y="183" fill="#fde68a" font-size="10" font-weight="700">• Pillar 2 (Archive &amp; 15-Yr WORM):</text>
  <text x="692" y="200" fill="#e2e8f0" font-size="9.5">EC2 i4i.4xlarge / CH Cloud + S3 Object Lock (COMPLIANCE)</text>
  <text x="684" y="221" fill="#fde68a" font-size="10" font-weight="700">• Pillar 3 (Control Plane &amp; Part 11 Audit):</text>
  <text x="692" y="238" fill="#e2e8f0" font-size="9.5">Amazon RDS PostgreSQL 16 (Multi-AZ, ltree) + ECS Fargate</text>
  <text x="684" y="259" fill="#fde68a" font-size="10" font-weight="700">• Pillar 3/4 (Private GxP AI, HMI &amp; Lakehouse):</text>
  <text x="692" y="276" fill="#e2e8f0" font-size="9.5">Amazon Bedrock (VPC Endpoint) + Grafana + Glue &amp; Athena</text>
  <text x="684" y="303" fill="#94a3b8" font-size="9.2">Config: aws_s3_worm.xml | PG_SSLMODE=verify-full</text>

  <!-- 2. Microsoft Azure Card -->
  <rect x="670" y="330" width="418" height="182" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="670" y="330" width="418" height="30" rx="8" fill="#075985"/>
  <text x="684" y="350" fill="#e0f2fe" font-size="11.5" font-weight="700">2. Microsoft Azure — ExpressRoute &amp; Private Link</text>
  <text x="684" y="377" fill="#7dd3fc" font-size="10" font-weight="700">• Pillar 2 (Archive &amp; 15-Yr WORM):</text>
  <text x="692" y="394" fill="#e2e8f0" font-size="9.5">Azure L16s_v3 / CH Cloud + Immutable Blob (Locked Policy)</text>
  <text x="684" y="415" fill="#fde68a" font-size="10" font-weight="700">• Pillar 3 (Control Plane &amp; Part 11 Audit):</text>
  <text x="692" y="432" fill="#e2e8f0" font-size="9.5">Azure DB for PostgreSQL Flexible Server (HA) + AKS / ACA</text>
  <text x="684" y="453" fill="#7dd3fc" font-size="10" font-weight="700">• Pillar 3/4 (Private GxP AI, HMI &amp; Lakehouse):</text>
  <text x="692" y="470" fill="#e2e8f0" font-size="9.5">Azure OpenAI (Private Link) + Grafana (Entra) + MS Fabric</text>
  <text x="684" y="497" fill="#94a3b8" font-size="9.2">Config: azure_blob_worm.xml | Entra Managed Identity</text>

  <!-- 3. Google Cloud (GCP) Card -->
  <rect x="670" y="524" width="418" height="182" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="670" y="524" width="418" height="30" rx="8" fill="#065f46"/>
  <text x="684" y="544" fill="#d1fae5" font-size="11.5" font-weight="700">3. Google Cloud (GCP) — Interconnect &amp; PSC</text>
  <text x="684" y="571" fill="#6ee7b7" font-size="10" font-weight="700">• Pillar 2 (Archive &amp; 15-Yr WORM):</text>
  <text x="692" y="588" fill="#e2e8f0" font-size="9.5">GCE n2-standard-16 / CH Cloud + GCS Bucket Lock (15-Yr)</text>
  <text x="684" y="609" fill="#6ee7b7" font-size="10" font-weight="700">• Pillar 3 (Control Plane &amp; Part 11 Audit):</text>
  <text x="692" y="626" fill="#e2e8f0" font-size="9.5">Cloud SQL PostgreSQL 16 (Enterprise Plus) + Cloud Run/GKE</text>
  <text x="684" y="647" fill="#6ee7b7" font-size="10" font-weight="700">• Pillar 3/4 (Private GxP AI, HMI &amp; Lakehouse):</text>
  <text x="692" y="664" fill="#e2e8f0" font-size="9.5">Vertex AI (Gemini 2.5 PSC) + Cloud IAP Grafana + BigLake</text>
  <text x="684" y="691" fill="#94a3b8" font-size="9.2">Config: gcp_gcs_worm.xml | PG_SSLMODE=verify-ca</text>

  <!-- Arrows from Column 2 to Column 3 -->
  <line x1="622" y1="212" x2="670" y2="212" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="622" y1="382" x2="670" y2="415" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="622" y1="554" x2="670" y2="610" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
</svg>
