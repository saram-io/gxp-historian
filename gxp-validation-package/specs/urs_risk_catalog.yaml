system_metadata:
  system_name: "OpenHistorian GxP Industrial Historian (ClickHouse + PostgreSQL Part 11 Control Plane)"
  system_version: "1.0.0"
  gamp_category: "Category 4 (Configured Software) & Category 5 (Custom FastAPI Control Plane / Triggers)"
  regulatory_frameworks:
    - "21 CFR Part 11 (Electronic Records; Electronic Signatures)"
    - "EU GMP Annex 11 (Computerised Systems)"
    - "ISPE GAMP 5 (Second Edition)"
    - "FDA Computer Software Assurance (CSA) Guidance"
    - "ALCOA+ Data Integrity Principles"

requirements:
  - urs_id: "URS-001"
    title: "Multi-Service Container Infrastructure & Non-Default GxP Security Credentials"
    description: "The system shall deploy isolated PostgreSQL Control Plane, ClickHouse Telemetry Archive, Edge Collector, FastAPI Control Plane, and Grafana HMI services using non-default authenticated credentials."
    frs_id: "FRS-INFRA-001"
    frs_specification: "All database, API, and HMI endpoints enforce non-default credentials configured via environment variables and pass readiness health checks."
    gamp_category: "Category 3 / Category 4"
    csa_risk_level: "Medium"
    testing_strategy: "Automated IQ Verification"
    regulation_ref: "21 CFR §11.10(d), EU GMP Annex 11 §12"
    pytest_node_id: "gxp-validation-package/tests/test_01_iq_infrastructure.py::test_iq_01_services_and_non_default_credentials"

  - urs_id: "URS-002"
    title: "PostgreSQL 16 Control Plane Extensions & Core GxP Schema Qualification"
    description: "The PostgreSQL Control Plane shall enable ltree, btree_gist, and pgcrypto extensions and provision tables for asset_templates, assets, tags, event_frames, users, and part11_audit_log."
    frs_id: "FRS-PG-002"
    frs_specification: "PostgreSQL 16 initializes ltree, btree_gist, and pgcrypto extensions, GiST hierarchy indexes, and all 6 required GxP tables."
    gamp_category: "Category 4"
    csa_risk_level: "Medium"
    testing_strategy: "Automated IQ Verification"
    regulation_ref: "21 CFR §11.10(a), GAMP 5 Appendix M4"
    pytest_node_id: "gxp-validation-package/tests/test_01_iq_infrastructure.py::test_iq_02_postgres_extensions_and_schema"

  - urs_id: "URS-003"
    title: "ClickHouse Lossless Time-Series Compression Codecs Verification"
    description: "The ClickHouse Telemetry Archive shall store high-frequency sensor data using lossless Delta, DoubleDelta, Gorilla, and T64 codecs layered with ZSTD(1)."
    frs_id: "FRS-CH-003"
    frs_specification: "Table pi_historian.sensor_data enforces CODEC(Delta, ZSTD(1)) on tag_id, CODEC(DoubleDelta, ZSTD(1)) on ts, CODEC(Gorilla, ZSTD(1)) on val, and CODEC(T64, ZSTD(1)) on quality and status_code."
    gamp_category: "Category 4"
    csa_risk_level: "Low"
    testing_strategy: "Automated IQ Verification"
    regulation_ref: "21 CFR §11.10(b), EU GMP Annex 11 §7.1"
    pytest_node_id: "gxp-validation-package/tests/test_01_iq_infrastructure.py::test_iq_03_clickhouse_compression_codecs"

  - urs_id: "URS-004"
    title: "ISA-95 ltree Asset Hierarchy & ClickHouse In-Memory Dictionary Synchronization"
    description: "The system shall synchronize ISA-95 hierarchical asset paths and tag metadata from PostgreSQL into ClickHouse via an in-memory FLAT dictionary."
    frs_id: "FRS-DICT-004"
    frs_specification: "ClickHouse dictionary pi_historian.pg_asset_tags resolves all seeded GxP tags and their ISA-95 asset_path strings from PostgreSQL v_clickhouse_tag_dict."
    gamp_category: "Category 4"
    csa_risk_level: "Medium"
    testing_strategy: "Automated IQ Verification"
    regulation_ref: "ISA-95, 21 CFR §11.10(a)"
    pytest_node_id: "gxp-validation-package/tests/test_01_iq_infrastructure.py::test_iq_04_clickhouse_postgres_dictionary_sync"

  - urs_id: "URS-005"
    title: "Stage 1 Edge Exception/Deadband Filtering & Disk WAL Store-and-Forward Buffer"
    description: "The Edge Collector shall perform Stage 1 Exception/Deadband filtering (ExcDev and ExcMax) and persist outbound batches in a disk-backed Write-Ahead Log (WAL) buffer."
    frs_id: "FRS-EDGE-005"
    frs_specification: "Telegraf edge-collector configures buffer_strategy='disk' at /var/lib/telegraf/buffer and applies ExcDev/ExcMax deadband filtering accurately."
    gamp_category: "Category 4 / Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ / IQ Verification"
    regulation_ref: "ALCOA+ (Complete, Original), EU GMP Annex 11 §7"
    pytest_node_id: "gxp-validation-package/tests/test_01_iq_infrastructure.py::test_iq_05_edge_collector_wal_and_deadband"

  - urs_id: "URS-006"
    title: "21 CFR Part 11 Mandatory Attribution Context Enforcement"
    description: "All INSERT, UPDATE, and DELETE operations on GxP configuration and batch Event Frame tables shall require authenticated actor_id and change_reason context or be rejected."
    frs_id: "FRS-P11-006"
    frs_specification: "PL/pgSQL trigger fn_enforce_part11_audit() raises '21 CFR Part 11 Violation: app.actor_id and app.change_reason are mandatory' when session context is missing."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ (Negative & Positive Testing)"
    regulation_ref: "21 CFR §11.10(e), ALCOA+ (Attributable)"
    pytest_node_id: "gxp-validation-package/tests/test_02_oq_part11_compliance.py::test_oq_01_reject_mutations_without_actor_or_reason"

  - urs_id: "URS-007"
    title: "21 CFR Part 11 §11.10(e) WORM Audit Trail Immutability"
    description: "The computer-generated, time-stamped audit trail (part11_audit_log) shall be strictly append-only (Write-Once-Read-Many) and block UPDATE, DELETE, and TRUNCATE operations."
    frs_id: "FRS-P11-007"
    frs_specification: "PL/pgSQL trigger fn_prevent_audit_tampering() unconditionally raises '21 CFR Part 11 WORM Violation: Audit trail records are immutable' on UPDATE, DELETE, or TRUNCATE."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ (Adversarial Tamper Challenge)"
    regulation_ref: "21 CFR §11.10(e), EU GMP Annex 11 §9"
    pytest_node_id: "gxp-validation-package/tests/test_02_oq_part11_compliance.py::test_oq_02_worm_audit_log_immutability"

  - urs_id: "URS-008"
    title: "21 CFR Part 11 §11.200 Electronic Signature Rejection of Unauthorized Credentials"
    description: "The system shall reject electronic signature attempts with invalid user IDs, wrong passwords, or missing change reasons."
    frs_id: "FRS-P11-008"
    frs_specification: "POST /api/v1/event-frames/{event_id}/sign verifies password against pgcrypto bcrypt hash and returns HTTP 401 on invalid credentials without altering the record."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ (Negative Security Testing)"
    regulation_ref: "21 CFR §11.10(d), §11.200(a)"
    pytest_node_id: "gxp-validation-package/tests/test_02_oq_part11_compliance.py::test_oq_03_electronic_signature_rejects_invalid_credentials"

  - urs_id: "URS-009"
    title: "21 CFR Part 11 §11.50 & §11.70 Electronic Signature Manifestation & HMAC Binding"
    description: "Signed Event Frames shall record the signer's user ID, timestamp, signature meaning, and cryptographic HMAC-SHA256 signature hash linked to the audit trail."
    frs_id: "FRS-P11-009"
    frs_specification: "POST /api/v1/event-frames/{event_id}/sign authenticates qa_approver_01, binds HMAC-SHA256 over (event_id, user_id, signature_meaning, signed_at), and logs to part11_audit_log."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ"
    regulation_ref: "21 CFR §11.50, §11.70, §11.200"
    pytest_node_id: "gxp-validation-package/tests/test_02_oq_part11_compliance.py::test_oq_04_electronic_signature_approval_and_hmac"

  - urs_id: "URS-010"
    title: "21 CFR Part 11 Cryptographic SHA-256 Audit Hash-Chain Verification"
    description: "Every audit trail entry shall chain the previous record's SHA-256 hash from GENESIS_0000000000000000, and the API shall verify end-to-end cryptographic integrity."
    frs_id: "FRS-P11-010"
    frs_specification: "GET /api/v1/audit-trail/verify recomputes the SHA-256 hash chain across all part11_audit_log records and confirms chain_valid == true."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ"
    regulation_ref: "21 CFR §11.10(e), ALCOA+ (Enduring, Accurate)"
    pytest_node_id: "gxp-validation-package/tests/test_02_oq_part11_compliance.py::test_oq_05_cryptographic_hash_chain_verification"

  - urs_id: "URS-011"
    title: "Multi-Protocol Telemetry Ingestion (OPC UA, BACnet/IP, Siemens S7, Legacy OPC DA)"
    description: "The historian shall ingest and normalize real-time telemetry across OPC UA, BACnet/IP, Siemens S7, and legacy Windows OPC DA bridges into ClickHouse."
    frs_id: "FRS-HIST-011"
    frs_specification: "All 5 multi-protocol tags (101, 102, 103, 301, 401) plus HTTP /ingest batches are archived in pi_historian.sensor_data with UTC millisecond timestamps."
    gamp_category: "Category 4"
    csa_risk_level: "Medium"
    testing_strategy: "Automated OQ Verification"
    regulation_ref: "21 CFR §211.68, ALCOA+ (Contemporaneous)"
    pytest_node_id: "gxp-validation-package/tests/test_03_oq_historian_core.py::test_oq_06_multi_protocol_telemetry_ingestion"

  - urs_id: "URS-012"
    title: "Bad OPC Signal Quality (quality < 192) Exclusion from GMP Rollups"
    description: "Telemetry points flagged with Bad (0) or Uncertain (64) OPC quality codes shall be stored in raw history for diagnostics but strictly excluded from 1-minute GMP rollups."
    frs_id: "FRS-HIST-012"
    frs_specification: "Materialized view pi_historian.mv_sensor_rollup_1m filters WHERE quality >= 192, excluding injected quality=0 fault spikes (e.g., val=9999.0) from min/max/avg rollups."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ (Fault Injection Challenge)"
    regulation_ref: "21 CFR §211.188, ALCOA+ (Accurate)"
    pytest_node_id: "gxp-validation-package/tests/test_03_oq_historian_core.py::test_oq_07_bad_quality_exclusion_in_rollup"

  - urs_id: "URS-013"
    title: "PI DataLink Parity: Linear Interpolation vs. Discrete Step (LOCF) Sampling"
    description: "The sampled data endpoint shall linearly interpolate continuous analog tags (is_step_tag=False) and apply Last Observation Carried Forward (LOCF) to discrete step tags (is_step_tag=True)."
    frs_id: "FRS-DL-013"
    frs_specification: "GET /api/v1/datalink/sampled computes exact linear midpoints for continuous tags and strict integer LOCF states for step tags without fractional artifacts."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ (Mathematical Boundary Verification)"
    regulation_ref: "21 CFR §11.10(b), GAMP 5"
    pytest_node_id: "gxp-validation-package/tests/test_03_oq_historian_core.py::test_oq_08_datalink_linear_and_locf_step_interpolation"

  - urs_id: "URS-014"
    title: "PI Vision PlotValues Parity: LTTB Visual Downsampling Peak Preservation"
    description: "Visual trend downsampling shall use ClickHouse largestTriangleThreeBuckets (LTTB) to preserve exact local excursion peaks and valleys."
    frs_id: "FRS-LTTB-014"
    frs_specification: "GET /api/v1/trends/plot-values preserves the exact timestamp and magnitude of a synthetic spike when downsampling high-density telemetry."
    gamp_category: "Category 4 / Category 5"
    csa_risk_level: "Medium"
    testing_strategy: "Scripted OQ"
    regulation_ref: "21 CFR §11.10(b)"
    pytest_node_id: "gxp-validation-package/tests/test_03_oq_historian_core.py::test_oq_09_lttb_downsampling_preserves_local_peak"

  - urs_id: "URS-015"
    title: "ISA-88 Event Frame Excursion Capture & Zero-ETL Apache Parquet Lakehouse Export"
    description: "The system shall automatically detect parameter excursions into Event Frames with summary KPIs and export enriched telemetry to Apache Parquet files with 100% fidelity."
    frs_id: "FRS-LAKE-015"
    frs_specification: "POST /api/v1/event-frames/evaluate captures excursion metrics in PostgreSQL and POST /api/v1/lakehouse/export-parquet writes a valid Snappy-compressed Parquet file verified via pyarrow."
    gamp_category: "Category 5"
    csa_risk_level: "High"
    testing_strategy: "Scripted OQ"
    regulation_ref: "21 CFR §11.10(b), ISA-88"
    pytest_node_id: "gxp-validation-package/tests/test_03_oq_historian_core.py::test_oq_10_event_frame_excursion_and_parquet_lakehouse_export"
